<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team – TeamUp</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
    <style>
        .s-card { background:#fff;border-radius:14px;padding:22px 24px;border:1.5px solid #d0dff0;margin-bottom:16px }
        .s-member-row { display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px }
        .s-member-row:last-child { border-bottom:none }
        .s-member-status { font-weight:700 }
        .s-member-status.accepted { color:#22c55e }
        .s-member-status.waiting  { color:#e94560 }
        .s-validation { background:#7ec8e3;border-radius:12px;padding:18px 20px;margin-bottom:16px }
        .s-validation h4 { font-size:14px;font-weight:700;color:#fff;margin-bottom:12px }
        .s-val-row { display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:#fff }
        .s-val-dot { width:11px;height:11px;border-radius:50%;flex-shrink:0 }
        .s-fix-text { font-size:13px;color:#555;font-weight:600;margin-bottom:6px }
        .s-action-row { display:flex;gap:12px;margin-top:8px;flex-wrap:wrap }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">My Team</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div style="display:flex">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <div style="flex:1;padding:28px 32px;overflow-y:auto;max-width:760px">
        <div id="team-content"><p style="color:#888">Loading…</p></div>
    </div>
</div>
<footer class="t-footer">High Fidelity Design Concept.</footer>
<script src="api.js"></script>
<script src="student-nav.js"></script>
<script>
    let unitId, teamData, myStudentId;

    (async () => {
        const nav = await initStudentNav({ activeItem:'my-team', pageTitle:'My Team' });
        if (!nav) return;
        unitId = nav.unitId;
        myStudentId = nav.user.username;
        await loadTeam();
    })();

    async function loadTeam() {
        teamData = await get(`/api/student/units/${unitId}/my-team`);
        render();
    }

    function render() {
        const el = document.getElementById('team-content');
        if (!teamData.team) {
            el.innerHTML = `
        <div class="s-card">
          <h3 style="font-size:19px;font-weight:800;margin-bottom:8px">My Team</h3>
          <p style="color:#888;margin-bottom:16px">You are not in a team yet.</p>
          <button class="t-open-btn" style="width:200px" onclick="window.location='/student-find-teammates.html?unitId=${unitId}'">Find Teammates</button>
        </div>`;
            return;
        }
        const { team, members, validation } = teamData;
        const isSubmitted = team.status !== 'FORMING';
        const allGreen = validation.sizeValid && validation.tutorialShared && validation.newToQutOk;
        const showRejectedNotice = !isSubmitted && !!team.last_rejected_at;
        const rejectedOn = showRejectedNotice
            ? new Date(team.last_rejected_at).toLocaleString('en-AU',
                { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' })
            : '';
        const fixes = [];
        if (!validation.sizeValid) {
            const needed = parseInt((team.valid_team_sizes||'4').split(',')[0]) - members.length;
            if (needed > 0) fixes.push(`Merge with ${needed} more student${needed>1?'s':''}.`);
        }
        if (!validation.tutorialShared) fixes.push('All members need a shared tutorial slot.');
        if (!validation.newToQutOk) fixes.push(`Maximum ${validation.maxNewToQut} new-to-QUT students allowed.`);

        el.innerHTML = `
      ${showRejectedNotice ? `
        <div class="s-card" style="border-color:#e94560;background:#fdecee">
          <p style="font-size:14px;font-weight:800;color:#a8253a;margin-bottom:4px">Your last submission was rejected by your teacher.</p>
          <p style="font-size:13px;color:#7a3a48;margin:0">Rejected on ${rejectedOn}. Please review your team and re-submit when ready.</p>
        </div>` : ''}
      <div class="s-card">
        <h3 style="font-size:19px;font-weight:800;margin-bottom:4px">My Team</h3>
        <p style="font-size:13px;color:#666;margin-bottom:16px">Team Name: <strong>${team.team_name}</strong></p>
        <div style="background:#7ec8e3;border-radius:8px;padding:8px 16px;margin-bottom:16px;font-size:13px;font-weight:700;color:#fff;display:inline-block">Team Members</div>
        <div id="members-list">
          ${members.map((m,i) => `
            <div class="s-member-row">
              <span style="min-width:20px;color:#888">${i+1}.</span>
              <span style="flex:1;font-weight:600">${m.name || m.student_id}</span>
              <span style="flex:1;color:#555">${m.role || '—'}</span>
              <span class="s-member-status accepted">Accepted</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="s-validation">
        <h4>Team Validation :</h4>
        <div class="s-val-row"><div class="s-val-dot" style="background:${validation.sizeValid?'#22c55e':'#e94560'}"></div> Team has ${members.length} student${members.length!==1?'s':''}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${validation.tutorialShared?'#22c55e':'#e94560'}"></div> ${validation.tutorialShared ? `Members share ${validation.sharedTutorials[0]}` : 'No shared tutorial slot found'}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${validation.newToQutOk?'#22c55e':'#e94560'}"></div> New-to-QUT students: ${validation.newToQutCount} / ${validation.maxNewToQut}</div>
      </div>
      ${!isSubmitted && !allGreen && fixes.length ? `
        <p class="s-fix-text">This team cannot be submitted yet.</p>
        ${fixes.map(f => `<p class="s-fix-text">Suggested fix: ${f}</p>`).join('')}` : ''}
      <div class="s-action-row">
        ${!isSubmitted ? `<button class="t-open-btn" style="width:200px" onclick="window.location='/student-find-teammates.html?unitId=${unitId}'">Find More Teammates</button>` : ''}
        ${!isSubmitted ? `<button class="t-open-btn" style="width:220px;${!allGreen?'background:#aaa;cursor:not-allowed':''}"
            ${!allGreen?'disabled':''} onclick="submitTeam()">Submit Team Request</button>` : ''}
        ${isSubmitted ? `<button class="t-open-btn" style="width:220px;background:#1a2a4a" onclick="window.location='/student-status.html?unitId=${unitId}'">View Status</button>` : ''}
        ${!isSubmitted ? `<button class="t-open-btn" style="width:180px;background:#e94560" onclick="leaveTeam()">Leave Team</button>` : ''}
      </div>`;
    }

    async function submitTeam() {
        try {
            await post(`/api/student/units/${unitId}/teams/${teamData.team.team_id}/submit`, {});
            alert('Team submitted successfully!');
            window.location = `/student-status.html?unitId=${unitId}`;
        } catch(e) { alert(e.message); }
    }

    async function leaveTeam() {
        if (!confirm('Are you sure you want to leave this team?')) return;
        try {
            await fetch(`/api/student/units/${unitId}/teams/${teamData.team.team_id}/leave`, { method: 'DELETE' });
            window.location = `/student-dashboard.html?unitId=${unitId}`;
        } catch(e) { alert(e.message); }
    }
</script>
</body>
</html>

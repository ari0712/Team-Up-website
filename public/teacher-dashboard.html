<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Teacher Dashboard</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Dashboard</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text">
      <span class="team">Team</span><span class="up">Up</span>
    </span>
    </a>
</header>

<div class="t-dashboard-layout">

    <!-- Left sidebar -->
    <nav class="t-sidebar-nav" id="teacher-sidebar"></nav>

    <!-- Middle content -->
    <main class="t-dash-content">

        <!-- Deadline banner -->
        <div class="t-deadline-banner">
            <div class="t-deadline-text">
                <div class="t-deadline-heading">Deadline</div>
                <div class="t-deadline-date" id="deadlineDate">–</div>
                <div class="t-deadline-remaining" id="deadlineRemaining"></div>
            </div>
            <div class="t-warning-circle">!</div>
        </div>

        <!-- Unit detail + carousel -->
        <div class="t-carousel-row">
            <button class="t-carousel-chevron">‹</button>
            <div class="t-unit-info-card">
                <h3 class="t-unit-info-title" id="unitInfoTitle">Loading…</h3>
                <span class="t-badge-ruleset">Group Rule Set</span>
                <ul class="t-rules-list" id="rulesList"></ul>
                <button class="t-edit-rules-btn" id="editRulesBtn">Edit Rule Set</button>
            </div>
        </div>

    </main>

    <!-- Vertical dashed divider -->
    <div class="t-vert-divider"></div>

    <!-- Right progress panel -->
    <aside class="t-progress-aside">
        <h2 class="t-progress-heading">Team Formation Progress</h2>
        <div id="progressRows" class="t-progress-rows"></div>
        <button class="t-view-progress-btn">View Progress</button>
    </aside>

</div>

<script src="api.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const unitId = params.get('unitId');

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        buildTeacherSidebar('dashboard');
        if (!unitId) { window.location = '/teacher-home.html'; return; }
        await Promise.all([loadUnit(), loadProgress()]);
    })();

    async function loadUnit() {
        try {
            const u = await get(`/api/units/${unitId}`);

            // Header title: "IFB398 IT Capstone Project Semester 1"
            document.getElementById('unitInfoTitle').textContent =
                [u.unit_name, u.description, u.semester].filter(Boolean).join(' ');

            // Deadline countdown
            if (u.deadline) {
                const d       = new Date(u.deadline);
                const dayName = d.toLocaleDateString('en-AU', { weekday: 'long' });
                const time    = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true });
                document.getElementById('deadlineDate').textContent = `${dayName} , ${time}`;

                const diffDays = Math.ceil((d - new Date()) / 86400000);
                document.getElementById('deadlineRemaining').textContent =
                    diffDays > 0  ? `${diffDays} day${diffDays !== 1 ? 's' : ''} remaining`
                        : diffDays === 0 ? 'Due today!'
                            : 'Past deadline';
            }

            // Build rules list from stored settings
            const sizes = (u.valid_team_sizes || '4').split(',').map(Number).sort((a,b) => a-b);
            const rules = [];
            if (sizes.length === 1) rules.push(`Team must have ${sizes[0]} students`);
            else rules.push(`Team must have ${sizes[0]}–${sizes[sizes.length-1]} students`);
            if (u.max_one_group)       rules.push('Every student can only be in one team');
            if (u.must_share_tutorial) rules.push('All members must share at least one tutorial');
            if (u.max_new_to_qut > 0) rules.push(`Maximum ${u.max_new_to_qut} new-to-QUT students in one team`);

            document.getElementById('rulesList').innerHTML = rules.map(r => `<li>✓ ${r}</li>`).join('');
            document.getElementById('editRulesBtn').onclick = () => openEditRules(u);

        } catch(e) { console.error('loadUnit:', e); }
    }

    async function loadProgress() {
        try {
            const p     = await get(`/api/units/${unitId}/progress`);
            const total = p.total || 0;

            const stages = [
                { label: 'Read rules',           count: p.readRules },
                { label: 'Enter preferences',    count: p.enteredPrefs },
                { label: 'Build or join team',   count: p.inTeam },
                { label: 'Submit team request',  count: p.submittedRequest }
            ];

            document.getElementById('progressRows').innerHTML = stages.map(s => {
                const done = total > 0 && s.count >= total;
                return `
        <div class="t-progress-row">
          <div class="t-dot ${done ? 't-dot-green' : 't-dot-red'}"></div>
          <span class="t-progress-label">${s.label}</span>
          <span class="t-progress-stat ${done ? 'green' : 'red'}">
            ${s.count} / ${total} ${done ? 'Completed' : 'In Progress'}
          </span>
        </div>`;
            }).join('');
        } catch(e) { console.error('loadProgress:', e); }
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }

    function buildTeacherSidebar(active) {
        const nav = document.getElementById('teacher-sidebar');
        const items = [
            { key: 'home',            label: 'Home',           href: '/teacher-home.html',              noUnit: true },
            { key: 'dashboard',       label: 'Dashboard',      href: '/teacher-dashboard.html' },
            { key: 'team-formation',  label: 'Team Formation', href: '/teacher-team-formation.html' },
            { key: 'class-list',      label: 'Class List',     href: '/teacher-class-list.html' },
            { key: 'announcements',   label: 'Announcements',  href: '/teacher-announcements.html' },
        ];
        nav.innerHTML = items.map(item => {
            const href = item.noUnit ? item.href : (unitId ? `${item.href}?unitId=${unitId}` : '#');
            if (item.key === active) {
                return `<button class="t-snav-active">${item.label}</button>`;
            }
            return `<a class="t-snav-link" href="${href}">${item.label}</a>`;
        }).join('');
    }

    let currentUnit = null;

    function openEditRules(u) {
        currentUnit = u;
        document.getElementById('er-sizes').value    = u.valid_team_sizes || '4';
        document.getElementById('er-newqut').value   = u.max_new_to_qut   || 2;
        document.getElementById('er-onegroup').checked = !!u.max_one_group;
        document.getElementById('er-tutorial').checked = !!u.must_share_tutorial;
        // Convert stored deadline to datetime-local format
        if (u.deadline) {
            const d = new Date(u.deadline);
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('er-deadline').value =
                `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        document.getElementById('er-save-msg').textContent = '';
        document.getElementById('editRulesModal').classList.add('open');
    }

    function closeEditRules() {
        document.getElementById('editRulesModal').classList.remove('open');
    }

    async function saveRules() {
        const payload = {
            validTeamSizes:    document.getElementById('er-sizes').value.trim(),
            maxNewToQut:       parseInt(document.getElementById('er-newqut').value) || 2,
            maxOneGroup:       document.getElementById('er-onegroup').checked,
            mustShareTutorial: document.getElementById('er-tutorial').checked,
            deadline:          document.getElementById('er-deadline').value
        };
        try {
            await put(`/api/units/${unitId}/rules`, payload);
            document.getElementById('er-save-msg').textContent = 'Saved!';
            setTimeout(closeEditRules, 800);
            await loadUnit();     // refresh the rules display on dashboard
        } catch(e) {
            document.getElementById('er-save-msg').style.color = '#e94560';
            document.getElementById('er-save-msg').textContent = e.message;
        }
    }
</script>
<!-- Edit Rules Modal -->
<div class="t-modal-overlay" id="editRulesModal">
    <div class="t-modal-box">
        <h3>Edit Rule Set</h3>
        <div class="t-modal-field">
            <label>Valid Team Sizes (comma-separated, e.g. 4,5)</label>
            <input type="text" id="er-sizes" placeholder="e.g. 4,5">
        </div>
        <div class="t-modal-field">
            <label>Max New-to-QUT Students Per Team</label>
            <input type="text" id="er-newqut" placeholder="e.g. 2">
        </div>
        <div class="t-modal-field">
            <div class="t-modal-toggle">
                <input type="checkbox" id="er-onegroup">
                <label for="er-onegroup">Max one group per student</label>
            </div>
        </div>
        <div class="t-modal-field">
            <div class="t-modal-toggle">
                <input type="checkbox" id="er-tutorial">
                <label for="er-tutorial">Students must share tutorial time</label>
            </div>
        </div>
        <div class="t-modal-field">
            <label>Deadline</label>
            <input type="datetime-local" id="er-deadline">
        </div>
        <p id="er-save-msg" class="t-save-msg"></p>
        <div class="t-modal-actions">
            <button class="t-modal-cancel" onclick="closeEditRules()">Cancel</button>
            <button class="t-modal-save" onclick="saveRules()">Save Changes</button>
        </div>
    </div>
</div>
</body>
</html>

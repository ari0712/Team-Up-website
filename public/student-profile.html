<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - TeamUp</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
    <style>
        .profile-shell {
            flex: 1;
            overflow-y: auto;
            background: #d3ecf5;
            padding: 34px 28px 24px 64px;
        }
        .profile-card {
            background: #fff;
            border: none;
            border-radius: 8px;
            width: 100%;
            min-height: 620px;
            margin: 0;
            padding: 32px 44px 44px;
            color: #2a3a4a;
        }
        .profile-inner {
            max-width: 360px;
            margin-left: 28px;
        }
        .t-header-title #page-title,
        #profile-heading {
            color: #1a2a4a;
        }
        .profile-card h2 {
            font-size: 20px;
            line-height: 1.15;
            margin-bottom: 6px;
            font-weight: 800;
        }
        .profile-role {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #555;
        }
        .profile-section {
            max-width: 290px;
            margin-bottom: 24px;
        }
        .profile-section-title {
            background: #7ec8e3;
            color: #fff;
            border-radius: 6px;
            padding: 9px 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 13px;
        }
        .profile-list {
            margin-left: 22px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            font-size: 14px;
            font-weight: 400;
            color: #555;
            line-height: 1.55;
        }
        .profile-empty {
            max-width: 480px;
            background: #f7fbff;
            border: 1.5px dashed #a9c8dc;
            border-radius: 8px;
            padding: 16px 18px;
            color: #5a7a9a;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }
        .profile-empty .t-open-btn {
            width: 180px;
            border-radius: 8px;
            margin-top: 14px;
        }
        @media (max-width: 760px) {
            .profile-shell { padding: 20px 16px; }
            .profile-card { padding: 26px 22px; min-height: 420px; }
            .profile-inner { margin-left: 0; max-width: none; }
            .profile-section { max-width: 100%; }
        }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Student Profile</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <main class="profile-shell">
        <section class="profile-card">
            <div class="profile-inner">
                <h2 id="profile-heading">Student Profile</h2>
                <p class="profile-role">Preferred Role: <span id="profile-role">Loading...</span></p>

                <div id="profile-content"></div>
            </div>
        </section>
    </main>
</div>
<footer class="t-footer">High Fidelity Design Concept.</footer>
<script src="api.js"></script>
<script src="student-nav.js"></script>
<script>
    let unitId;

    const splitValues = value => (value || '')
        .split(',')
        .map(v => v.trim())
        .filter(Boolean);

    const escapeHtml = value => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    const labelOrEmpty = (value, fallback = 'Not set yet') => {
        const trimmed = (value || '').trim();
        return trimmed && trimmed !== 'None' ? trimmed : fallback;
    };

    function formatStudentHeading(user) {
        const name = user.displayName || user.username || 'Student';
        const studentNumber = user.studentId || user.student_id || '';
        return studentNumber && studentNumber !== name ? `${name} ${studentNumber}` : name;
    }

    function renderSection(title, values) {
        const items = values.length ? values : ['Not set yet'];
        const lis = items.map(item => `<li>${escapeHtml(item)}</li>`).join('');
        return `
            <div class="profile-section">
                <div class="profile-section-title">${escapeHtml(title)}</div>
                <ul class="profile-list">${lis}</ul>
            </div>
        `;
    }

    function renderEmptyState() {
        return `
            <div class="profile-empty">
                Your profile will appear here after you save your preferences for this unit.
                <button class="t-open-btn" onclick="window.location='/student-preferences.html?unitId=${unitId}'">
                    Add Preferences
                </button>
            </div>
        `;
    }

    (async () => {
        const nav = await initStudentNav({ activeItem: 'profile', pageTitle: 'Student Profile' });
        if (!nav) return;
        unitId = nav.unitId;
        const studentName = nav.user.displayName || nav.user.username || 'Student';
        const title = `${studentName}'s Profile`;
        document.title = `${title} - TeamUp`;
        document.getElementById('page-title').textContent = title;
        document.getElementById('profile-heading').textContent = formatStudentHeading(nav.user);

        const unit = await requireUnitAccess(unitId);
        if (!unit) return;

        const prefs = await get(`/api/student/units/${unitId}/prefs`);
        const content = document.getElementById('profile-content');
        const role = document.getElementById('profile-role');

        if (!prefs) {
            role.textContent = 'Not set yet';
            content.innerHTML = renderEmptyState();
            return;
        }

        role.textContent = labelOrEmpty(prefs.preferred_role);
        content.innerHTML = [
            renderSection('Tutorial Availability', splitValues(prefs.tutorial_slots)),
            renderSection('Interests', splitValues(prefs.project_interests)),
            renderSection('Skills', splitValues(prefs.skills))
        ].join('');
    })().catch(err => {
        document.getElementById('profile-role').textContent = 'Unable to load';
        document.getElementById('profile-content').innerHTML =
            `<div class="profile-empty">Could not load your profile: ${escapeHtml(err.message)}</div>`;
    });
</script>
</body>
</html>

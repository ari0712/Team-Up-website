<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - TeamUp</title>
    <link rel="icon" type="image/png" href="teamup-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ramabhadra&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
    <style>
        .s-card { background:#fff;border-radius:14px;padding:22px 24px;border:1.5px solid #d0dff0;margin-bottom:16px }
        .s-member-row { display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:14px }
        .s-member-row:last-child { border-bottom:none }
        .s-validation { background:#7ec8e3;border-radius:12px;padding:18px 20px }
        .s-val-row { display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:#fff }
        .s-val-dot { width:11px;height:11px;border-radius:50%;flex-shrink:0 }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Status</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div style="display:flex">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <div style="flex:1;padding:28px 32px;overflow-y:auto;max-width:760px">
        <div id="status-content"><p style="color:#888">Loading…</p></div>
    </div>
</div>

<script src="api.js"></script>
<script src="student-nav.js"></script>
<script>
    (async () => {
        const nav = await initStudentNav({ activeItem:'status', pageTitle:'Status' });
        if (!nav) return;
        const { unitId } = nav;
        const teamData = await get(`/api/student/units/${unitId}/my-team`);
        const el = document.getElementById('status-content');
        if (!teamData.team || teamData.team.status === 'FORMING') {
            el.innerHTML = '<p style="color:#888">You have not submitted a team request yet.</p>'; return;
        }
        const { team, members, validation } = teamData;
        const statusColor = team.status==='APPROVED' ? '#22c55e' : team.status==='REJECTED' ? '#e94560' : '#f5a623';
        const statusLabel = team.status==='APPROVED' ? 'Approved' : team.status==='REJECTED' ? 'Rejected' : 'Pending Teacher Review';
        const submitted = team.submitted_at ? new Date(team.submitted_at).toLocaleString('en-AU',{weekday:'long',hour:'numeric',minute:'2-digit'}) : '';
        el.innerHTML = `
      <div class="s-card">
        <h3 style="font-size:19px;font-weight:800;margin-bottom:6px">Team Request Status</h3>
        <p style="font-size:14px;font-weight:700;color:${statusColor};margin-bottom:10px">${statusLabel}</p>
        <p style="font-size:14px;margin-bottom:4px">Your team request has been submitted successfully.</p>
        <p style="font-size:14px;color:#555">Your teacher will review it before final teams are published.</p>
        <hr style="border:none;border-top:1px solid #e0e0e0;margin:16px 0">
        <p style="font-size:14px;margin-bottom:4px"><strong>Team Name:</strong> ${team.team_name}</p>
        ${submitted ? `<p style="font-size:14px;margin-bottom:12px"><strong>Submitted:</strong> ${submitted}</p>` : ''}
        <div style="background:#7ec8e3;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:700;color:#fff;display:inline-block;margin-bottom:12px">Team Members</div>
        ${members.map((m,i) => `
          <div class="s-member-row">
            <span style="min-width:20px;color:#888">${i+1}.</span>
            <span style="flex:1;font-weight:600">${m.name||m.student_id}</span>
            <span style="color:#555">${m.role||'—'}</span>
          </div>`).join('')}
      </div>
      <div class="s-validation">
        <h4 style="font-size:14px;font-weight:700;color:#fff;margin-bottom:12px">Team Validation :</h4>
        <div style="font-size:13px;font-weight:600;color:#fff;margin-bottom:10px">Team Quality Score: ${team.quality_score || 88}%</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:#22c55e"></div> Team has ${members.length} students</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${validation.tutorialShared?'#22c55e':'#e94560'}"></div> ${validation.tutorialShared?`Members share ${validation.sharedTutorials[0]}`:'No shared tutorial'}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${validation.newToQutOk?'#22c55e':'#e94560'}"></div> New-to-QUT students: ${validation.newToQutCount} / ${validation.maxNewToQut}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:#22c55e"></div> All members accepted</div>
      </div>`;
    })();
</script>
</body>
</html>

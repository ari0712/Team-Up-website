<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Teacher Home</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Home</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text">
      <span class="team">Team</span><span class="up">Up</span>
    </span>
    </a>
</header>

<main class="t-main">
    <button class="t-add-unit-btn" onclick="window.location='/teacher-create-unit.html'">Add Unit +</button>
    <div id="unitGrid" class="t-unit-grid"></div>
</main>

<footer class="t-footer">High Fidelity Design Concept.</footer>

<script src="api.js"></script>
<script>
    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        loadUnits();
    })();

    async function loadUnits() {
        const grid = document.getElementById('unitGrid');
        try {
            const units = await get('/api/units');
            if (units.length === 0) {
                grid.innerHTML = '<p class="t-empty">No units yet. Click "Add Unit +" to create one.</p>';
                return;
            }
            grid.innerHTML = units.map(u => `
      <div class="t-unit-card">
        <div class="t-unit-body">
          <h3 class="t-unit-name">${u.unit_name}</h3>
          <p class="t-unit-desc">${u.description || ''}</p>
          <p class="t-unit-sem">${u.semester || ''}</p>
          <div class="t-unit-stats">
            <div class="t-stat-row">
              <span>Students</span>
              <span>${u.student_count}</span>
            </div>
            <div class="t-stat-row">
              <span>Teams Generated</span>
              <span class="${u.teams_generated === 0 ? 't-red' : ''}">
                ${u.teams_generated}
              </span>
            </div>
            <div class="t-stat-row">
              <span>Students In Teams</span>
              <span>${u.students_in_teams} / ${u.student_count}</span>
            </div>
          </div>
        </div>
        <button class="t-open-btn" onclick="openUnit('${u.unit_id}')">Open</button>
      </div>
    `).join('');
        } catch (e) {
            grid.innerHTML = `<p class="t-empty">Error loading units: ${e.message}</p>`;
        }
    }

    function openUnit(unitId) {
        // Future: navigate to a unit detail page
        alert(`Unit ${unitId} — detail page coming soon.`);
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

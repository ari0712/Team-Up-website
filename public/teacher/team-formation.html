<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Team Formation</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        .tf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .tf-team-card {
            background: #fff;
            border-radius: 14px;
            padding: 22px 24px;
            border: 1.5px solid #d0dff0;
        }
        .tf-team-id {
            font-size: 18px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 14px;
        }
        .tf-val-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a4a;
            margin-bottom: 8px;
        }
        .tf-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tf-dot-green { background: #22c55e; }
        .tf-dot-red   { background: #e94560; }
        .tf-dot-amber { background: #f5a623; }
        .tf-org-team.seed { border-color: #2663ff; }
        .tf-org-lock { font-size: 10px; font-weight: 700; color: #2663ff; background: #eff4ff;
                       padding: 1px 6px; border-radius: 20px; margin-left: 4px; white-space: nowrap; }
        .tf-org-dissolved { background: #fff8e6; border: 1.5px solid #f0d9a0; border-radius: 10px;
                            padding: 10px 14px; font-size: 12px; color: #6b5a2e; margin: 10px 0; }
        .tf-view-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            background: #2663ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .tf-view-btn:hover { background: #1a4fcc; }
        .tf-status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .tf-status-open       { background: #cfe2ff; color: #0c447c; }
        .tf-status-finalised  { background: #d1e7dd; color: #0a3622; }
        .tf-batches { margin-top: 14px; font-size: 12px; color: #555; }
        .tf-batch { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                    padding: 6px 0; border-bottom: 1px solid #eef3f8; }
        .tf-batch button { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1.5px solid #e94560;
                           background: #fff; color: #e94560; cursor: pointer; }
        .tf-batch button:disabled { opacity: .5; cursor: not-allowed; }
        .tf-confirm { background: #fff8e6; border: 1.5px solid #f0d9a0; border-radius: 12px; padding: 14px 18px; margin-top: 12px; }
        .tf-confirm h4 { font-size: 14px; font-weight: 800; color: #8a6100; margin: 0 0 6px; }
        .tf-confirm p { font-size: 13px; color: #6b5a2e; margin: 0 0 10px; }
        .tf-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 20px 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a4a;
        }
        .tf-pagination button {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #2663ff;
            cursor: pointer;
            padding: 4px 8px;
        }
        .tf-pagination button:disabled { color: #aaa; cursor: default; }
        .tf-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .tf-modal-overlay.open { display: flex; }
        .tf-modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .tf-modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: #1a2a4a; }
        .tf-modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            margin-top: -4px;
        }
        .tf-member-row {
            display: flex;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .tf-member-row:last-child { border-bottom: none; }
        .tf-approve-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            margin-right: 10px;
        }
        .tf-reject-btn {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }
        .tf-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tf-tab {
            flex: 1;
            min-width: 160px;
            background: #fff;
            border: 1.5px solid #d0dff0;
            border-left: 5px solid #d0dff0;
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s, box-shadow 0.15s;
        }
        .tf-tab:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .tf-tab-label { font-size: 14px; font-weight: 800; color: #1a2a4a; margin-bottom: 4px; }
        .tf-tab-count { font-size: 13px; color: #666; font-weight: 600; }
        .tf-tab-count strong { font-size: 18px; color: #1a2a4a; }
        .tf-tab.tf-tab-open      { border-left-color: #2663ff; }
        .tf-tab.tf-tab-finalised { border-left-color: #22c55e; }
        .tf-tab.active { background: #1a2a4a; }
        .tf-tab.active .tf-tab-label,
        .tf-tab.active .tf-tab-count,
        .tf-tab.active .tf-tab-count strong { color: #fff; }
        .tf-section-empty {
            color: #888;
            font-size: 14px;
            font-style: italic;
            padding: 24px;
            text-align: center;
            background: #fff;
            border: 1.5px dashed #d0dff0;
            border-radius: 10px;
        }
        /* ── Deadline lock + organiser ─────────────────────────────────── */
        .tf-lock { border-radius: 14px; padding: 18px 22px; margin-bottom: 18px;
                   border: 1.5px solid #d0dff0; background: #fff; }
        .tf-lock.open   { border-color: #d0dff0; }
        .tf-lock.closed { border-color: #d03b3b; background: #fdf3f3; }
        .tf-lock h3 { font-size: 17px; font-weight: 800; color: #1a2a4a; margin: 0 0 6px;
                      display: flex; align-items: center; gap: 8px; }
        .tf-lock p { font-size: 13px; color: #555; margin: 0 0 12px; line-height: 1.55; }
        .tf-lock-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .tf-btn { border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 700;
                  cursor: pointer; border: 1.5px solid #2663ff; background: #2663ff; color: #fff; }
        .tf-btn.ghost { background: #fff; color: #2663ff; }
        .tf-btn.go { background: #0ca30c; border-color: #0ca30c; }
        .tf-btn:disabled { opacity: .5; cursor: not-allowed; }

        .tf-org-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                       gap: 12px; margin: 14px 0; }
        .tf-org-team { border: 1.5px solid #d0dff0; border-radius: 12px; padding: 12px 14px; background: #fff; }
        .tf-org-team.bad { border-color: #fab219; background: #fffdf5; }
        .tf-org-team h4 { font-size: 14px; font-weight: 800; color: #1a2a4a; margin: 0 0 4px; }
        .tf-org-reasons { font-size: 11px; color: #666; line-height: 1.5; margin-bottom: 8px; }
        .tf-org-member { display: flex; align-items: center; gap: 6px; padding: 5px 0;
                         border-bottom: 1px solid #f0f4fa; font-size: 13px; }
        .tf-org-member:last-child { border-bottom: none; }
        .tf-org-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tf-org-role { font-size: 11px; color: #888; }
        .tf-org-move { font-size: 11px; border: 1.5px solid #d0dff0; border-radius: 6px; padding: 2px 4px; }
        .tf-org-flag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
        .tf-org-flag.ok  { background: #eefaee; color: #0a7d0a; }
        .tf-org-flag.warn { background: #fff8e6; color: #8a6100; }
        .tf-org-unassigned { border: 1.5px dashed #e94560; background: #fff7f8; }
    </style>
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Team Formation</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span>
    </a>
</header>

<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="teacher-sidebar"></nav>

    <main class="t-dash-content">
        <!-- Deadline lock + auto-matching. Suggestions only exist once formation
             has closed, so before the deadline this is purely informational. -->
        <div id="lock-panel" class="tf-lock"></div>
        <div id="organiser" style="display:none"></div>

        <div id="status-tabs" class="tf-tabs"></div>
        <div id="teams-sections">
            <p class="t-empty">Loading teams…</p>
        </div>
    </main>

    <div class="t-vert-divider"></div>

    <aside class="t-progress-aside">
        <h2 class="t-progress-heading">Summary</h2>
        <div id="summary-rows" class="t-progress-rows"></div>
        <div id="batches" class="tf-batches"></div>
    </aside>
</div>

<!-- Team detail modal -->
<div class="tf-modal-overlay" id="teamModal">
    <div class="tf-modal">
        <button class="tf-modal-close" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/teacher-nav.js"></script>
<script src="/assets/js/team-sizes.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const unitId = params.get('unitId');
    let allTeams = [];
    let activeStatus = 'OPEN';

    // Two statuses, from the coordinator's point of view. Nothing here waits
    // on approval: an accepted team-up request is the record.
    const STATUS_GROUPS = [
        { key: 'OPEN',      label: 'Open',      cls: 'tf-tab-open',      hideWhenEmpty: false },
        { key: 'FINALISED', label: 'Finalised', cls: 'tf-tab-finalised', hideWhenEmpty: false },
    ];
    const STATUS_LABEL = { OPEN: 'Open', FINALISED: 'Finalised' };

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        if (!unitId) { window.location = '/teacher/home.html'; return; }
        buildTeacherSidebar('team-formation');
        // Unit first: the team cards word their size against the unit's target.
        await loadLockPanel();
        await loadTeams();
        await loadBatches();
    })();

    // ── Deadline lock + organiser ────────────────────────────────────────
    // `locked` is derived from the unit's deadline, exactly as the server does
    // it — no separate flag to fall out of sync.
    let unitInfo = null, draft = null;

    const isLocked = u => {
        if (!u || !u.deadline) return false;
        const at = Date.parse(u.deadline);
        return !isNaN(at) && at <= Date.now();
    };

    async function loadLockPanel() {
        const el = document.getElementById('lock-panel');
        try {
            unitInfo = await get(`/api/units/${unitId}`);
        } catch (e) { el.innerHTML = `<p>Could not load the unit: ${esc(e.message)}</p>`; return; }

        const when = unitInfo.deadline
            ? new Date(unitInfo.deadline).toLocaleString('en-AU',
                { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
                  hour: 'numeric', minute: '2-digit' })
            : null;

        if (!isLocked(unitInfo)) {
            el.className = 'tf-lock open';
            el.innerHTML = `
                <h3>🔓 Team formation is open</h3>
                <p>${when
                    ? `Students can form teams until <strong>${esc(when)}</strong>. Grouping suggestions
                       unlock automatically once that passes.`
                    : `No deadline is set, so team formation never closes. Set one on the
                       <a href="/teacher/dashboard.html?unitId=${encodeURIComponent(unitId)}">dashboard</a>
                       to close formation and unlock grouping suggestions.`}</p>`;
            return;
        }

        el.className = 'tf-lock closed';
        el.innerHTML = `
            <h3>🔒 Team formation is closed</h3>
            <p>The deadline passed on <strong>${esc(when)}</strong>. Students can no longer send or accept
               team-up requests, or leave a team — you finalise the remaining teams from here. To reopen,
               push the deadline out on the
               <a href="/teacher/dashboard.html?unitId=${encodeURIComponent(unitId)}">dashboard</a>.</p>
            <div class="tf-lock-actions">
                <button class="tf-btn" onclick="generateSuggestions()">Generate suggestions</button>
                <button class="tf-btn ghost" onclick="organiseManually()">Organise manually</button>
            </div>`;
    }

    // Fail with a cause, not a TypeError three calls deep. A response missing
    // `teams` means the endpoint did not really answer — most often a server
    // still running older code, where the SPA catch-all returns index.html
    // with a 200 and the JSON parse quietly yields {}.
    function requireSuggestions(s) {
        if (!s || !Array.isArray(s.teams) || !Array.isArray(s.unassigned)) {
            throw new Error('the server did not return a grouping. If you have just updated ' +
                            'the code, restart the server (npm start) and try again.');
        }
        return s;
    }

    async function generateSuggestions() {
        const org = document.getElementById('organiser');
        org.style.display = 'block';
        org.innerHTML = '<p class="t-empty">Matching…</p>';
        try {
            const s = requireSuggestions(await get(`/api/units/${unitId}/suggestions`));
            draft = {
                teams: s.teams.map(t => ({ members: t.members, reasons: t.reasons,
                                           seed: t.seed_team_name || null,
                                           locked: new Set(t.locked_member_ids || []) })),
                unassigned: s.unassigned,
                meta: s,
            };
            renderOrganiser('Suggested grouping');
        } catch (e) {
            org.innerHTML = `<p class="t-empty">Could not build suggestions: ${esc(e.message)}</p>`;
        }
    }

    // Same editor, but starting from nobody grouped — the teacher builds it.
    async function organiseManually() {
        const org = document.getElementById('organiser');
        org.style.display = 'block';
        org.innerHTML = '<p class="t-empty">Loading students…</p>';
        try {
            const s = requireSuggestions(await get(`/api/units/${unitId}/suggestions`));
            // Protected groups start as their own teams even in manual mode —
            // the server refuses to split them, so the editor must not offer to.
            const seeds = s.teams.filter(t => t.seed_team_id).map(t => ({
                members: t.members.filter(m => t.locked_member_ids.includes(m.student_id)),
                reasons: [], seed: t.seed_team_name, locked: new Set(t.locked_member_ids) }));
            const lockedIds = new Set(seeds.flatMap(t => [...t.locked]));
            const everyone = [...s.teams.flatMap(t => t.members), ...s.unassigned]
                .filter(m => !lockedIds.has(m.student_id));
            draft = { teams: seeds, unassigned: everyone, meta: s };
            renderOrganiser('Manual grouping');
        } catch (e) {
            org.innerHTML = `<p class="t-empty">Could not load: ${esc(e.message)}</p>`;
        }
    }

    function draftValidation(members) {
        const sizes = String(draft.meta.valid_team_sizes || '4').split(',')
            .map(n => parseInt(n)).filter(Boolean);
        const sizeOk = sizes.includes(members.length);
        const overMax = members.length > Math.max(...sizes);
        const slotSets = members.map(m => new Set(
            String(m.tutorial_slots || '').split(',').map(x => x.trim()).filter(Boolean)));
        const shared = slotSets.length
            ? [...slotSets[0]].filter(s => slotSets.every(set => set.has(s))) : [];
        const roles = members.map(m => m.preferred_role).filter(Boolean);
        const dup = roles.length !== new Set(roles).size;
        // The count is always shown — the coordinator balances newcomers by
        // hand — but it is only a RULE when the unit sets a cap (null = none).
        const cap = draft.meta.max_new_to_qut;
        const newCount = members.filter(m => m.is_new_to_qut).length;
        const newOk = cap == null || newCount <= cap;
        // `bad` is a hard rule broken — the server will refuse it. Under target
        // is not in here: a group of 3 is a legitimate outcome.
        const bad = overMax || !newOk || (draft.meta.must_share_tutorial && !shared.length);
        return { sizeOk, overMax, shared, dup, cap, newCount, newOk, bad };
    }

    function renderOrganiser(title) {
        const org = document.getElementById('organiser');
        const groups = draft.teams.map((t, i) => ({ label: `Team ${i + 1}`, idx: i, members: t.members, reasons: t.reasons }));
        const options = i => [
            ...groups.map(g => `<option value="${g.idx}" ${g.idx === i ? 'selected' : ''}>${esc(g.label)}</option>`),
            `<option value="new">+ New team</option>`,
            `<option value="un" ${i === null ? 'selected' : ''}>Unassigned</option>`,
        ].join('');

        const card = (g) => {
            const v = draftValidation(g.members);
            const bad = v.bad;
            const t = draft.teams[g.idx];
            return `
            <div class="tf-org-team ${bad ? 'bad' : ''} ${t.seed ? 'seed' : ''}">
                <h4>${esc(g.label)} · ${g.members.length} members${t.seed
                    ? ` <span class="tf-org-lock">🔒 ${esc(t.seed)}</span>` : ''}</h4>
                <div class="tf-org-reasons">
                    <span class="tf-org-flag ${v.overMax ? 'warn' : 'ok'}">${v.overMax ? '! over max' : v.sizeOk ? '✓' : '·'} size ${g.members.length}${v.sizeOk || v.overMax ? '' : ' of ' + esc(sizeRangeLabel(draft.meta.valid_team_sizes))}</span>
                    <span class="tf-org-flag ${v.shared.length ? 'ok' : 'warn'}">${v.shared.length ? '✓ ' + esc(v.shared[0]) : '! no shared tutorial'}</span>
                    <span class="tf-org-flag ${v.dup ? 'warn' : 'ok'}">${v.dup ? '! repeated role' : '✓ distinct roles'}</span>
                    <span class="tf-org-flag ${v.newOk ? 'ok' : 'warn'}">${v.newOk ? '·' : '!'} ${v.newCount} new-to-QUT${v.cap == null ? '' : ' of ' + v.cap}</span>
                </div>
                ${g.members.map(m => `
                    <div class="tf-org-member">
                        <span class="tf-org-name">${esc(m.name || m.student_id)}
                            <span class="tf-org-role">${esc(m.preferred_role || 'no role')}</span>${
                            t.locked?.has(m.student_id) ? '<span class="tf-org-lock" title="Part of a recorded group — moves with it">🔒</span>' : ''}</span>
                        <select class="tf-org-move" onchange="moveStudent('${esc(m.student_id)}', this.value)">
                            ${options(g.idx)}
                        </select>
                    </div>`).join('') || '<p style="font-size:12px;color:#888">Empty</p>'}
            </div>`;
        };

        const dissolved = (draft.meta.dissolved || []);
        const dissolvedNote = dissolved.length ? `
            <div class="tf-org-dissolved">
                <strong>Split because a rule was broken:</strong>
                ${dissolved.map(d => `<div>${esc(d.team_name)} — ${esc(d.reason)}</div>`).join('')}
            </div>` : '';

        const unassignedCard = `
            <div class="tf-org-team tf-org-unassigned">
                <h4>Unassigned · ${draft.unassigned.length}</h4>
                <div class="tf-org-reasons">${draft.unassigned.length && draft.meta.unassigned_reason
                    ? esc(draft.meta.unassigned_reason)
                    : 'These students will keep their current team unless you place them.'}</div>
                ${draft.unassigned.map(m => `
                    <div class="tf-org-member">
                        <span class="tf-org-name">${esc(m.name || m.student_id)}
                            <span class="tf-org-role">${esc(m.preferred_role || 'no role')}</span></span>
                        <select class="tf-org-move" onchange="moveStudent('${esc(m.student_id)}', this.value)">
                            ${options(null)}
                        </select>
                    </div>`).join('') || '<p style="font-size:12px;color:#888">Nobody</p>'}
            </div>`;

        const anyBad = groups.some(g => draftValidation(g.members).bad);

        org.innerHTML = `
            <div class="tf-lock open">
                <h3>${esc(title)}</h3>
                <p>A suggestion, not an allocation: move any student with the dropdown beside their name, then
                   finalise. Finalising is reversible — every save is a batch you can revert from the sidebar.
                   🔒 marks a group the students formed themselves — it moves as one and is never split.
                   Amber teams break a hard rule and cannot be finalised until fixed; a team under the target
                   size is fine. Students left unassigned keep the team they are in now.</p>
                ${dissolvedNote}
                <div class="tf-org-grid">${groups.map(card).join('')}${unassignedCard}</div>
                <div class="tf-lock-actions">
                    <button class="tf-btn go" onclick="confirmFinalise()" ${groups.length && !anyBad ? '' : 'disabled'}>
                        Finalise ${groups.length} team${groups.length === 1 ? '' : 's'}</button>
                    <button class="tf-btn ghost" onclick="cancelDraft()">Cancel</button>
                </div>
                <div id="finalise-confirm"></div>
                ${anyBad ? '<p style="font-size:12px;color:#8a6100;margin-top:10px">⚠ Fix the amber teams first — the server refuses a team that breaks a hard rule.</p>' : ''}
                <p id="org-msg" style="font-size:13px;font-weight:700;margin-top:8px"></p>
            </div>`;
    }

    function moveStudent(studentId, target) {
        // A member of a recorded group carries the whole group with them: the
        // server refuses to split one, so the editor never shows a split.
        const home = draft.teams.find(t => t.locked?.has(studentId));
        const ids = home ? [...home.locked] : [studentId];
        const lock = home ? home.locked : null;
        const seed = home ? home.seed : null;
        if (home && target === 'un') { alert('A recorded group cannot be left unassigned. Move it to a team instead.'); return; }

        // Pull them out of wherever they are.
        const moved = [];
        draft.unassigned = draft.unassigned.filter(m => {
            if (ids.includes(m.student_id)) { moved.push(m); return false; }
            return true;
        });
        draft.teams.forEach(t => {
            t.members = t.members.filter(m => {
                if (ids.includes(m.student_id)) { moved.push(m); return false; }
                return true;
            });
            if (lock && t.locked === lock) { t.locked = new Set(); t.seed = null; }
        });
        if (!moved.length) return;

        let dest;
        if (target === 'un') { draft.unassigned.push(...moved); }
        else if (target === 'new') { dest = { members: [], reasons: [] }; draft.teams.push(dest); }
        else dest = draft.teams[parseInt(target)];
        if (dest) {
            dest.members.push(...moved);
            if (lock) {
                if (dest.locked?.size) {
                    // Two recorded groups in one team: both stay whole.
                    dest.locked = new Set([...dest.locked, ...lock]);
                    dest.seed = `${dest.seed} + ${seed}`;
                } else { dest.locked = lock; dest.seed = seed; }
            }
        }

        draft.teams = draft.teams.filter(t => t.members.length);   // drop emptied teams
        renderOrganiser(document.querySelector('#organiser h3').textContent);
    }

    function cancelDraft() {
        draft = null;
        document.getElementById('organiser').style.display = 'none';
        document.getElementById('organiser').innerHTML = '';
    }

    // Finalising is bulk and terminal for the students, so it asks first — in
    // the page, stating exactly what will happen, with an explicit click.
    function confirmFinalise() {
        const groups = draft.teams.map(t => t.members.map(m => m.student_id)).filter(g => g.length);
        const students = groups.reduce((n, g) => n + g.length, 0);
        const unassigned = draft.unassigned.length;
        document.getElementById('finalise-confirm').innerHTML = `
            <div class="tf-confirm">
                <h4>Finalise this grouping?</h4>
                <p>This will finalise <strong>${groups.length} team${groups.length === 1 ? '' : 's'}</strong> covering
                   <strong>${students} student${students === 1 ? '' : 's'}</strong>; <strong>${unassigned}</strong>
                   student${unassigned === 1 ? '' : 's'} stay${unassigned === 1 ? 's' : ''} unassigned and keep${unassigned === 1 ? 's' : ''} their current team.
                   Rules have been checked. The students will be notified and can no longer change these teams.
                   You can revert this batch from the sidebar.</p>
                <div class="tf-lock-actions">
                    <button class="tf-btn go" onclick="finaliseDraft()">Yes, finalise ${groups.length} team${groups.length === 1 ? '' : 's'}</button>
                    <button class="tf-btn ghost" onclick="document.getElementById('finalise-confirm').innerHTML=''">Not yet</button>
                </div>
            </div>`;
    }

    async function finaliseDraft() {
        const msg = document.getElementById('org-msg');
        const groups = draft.teams.map(t => t.members.map(m => m.student_id)).filter(g => g.length);
        if (!groups.length) { msg.style.color = '#e94560'; msg.textContent = 'Build at least one team first.'; return; }
        try {
            const r = await post(`/api/units/${unitId}/finalise-teams`, { teams: groups });
            cancelDraft();
            await loadTeams();
            await loadBatches();
            document.getElementById('batches').insertAdjacentHTML('afterbegin',
                `<p style="color:#0a7d0a;font-weight:700;margin:0 0 6px">${r.teams.length} team${r.teams.length === 1 ? '' : 's'} finalised.</p>`);
        } catch (e) { msg.style.color = '#e94560'; msg.textContent = e.message; document.getElementById('finalise-confirm').innerHTML = ''; }
    }

    // ── Finalise batches: the way back ──────────────────────────────────
    async function loadBatches() {
        const el = document.getElementById('batches');
        try {
            const batches = await get(`/api/units/${unitId}/finalise-batches`);
            if (!batches.length) { el.innerHTML = ''; return; }
            el.innerHTML = `<div style="font-weight:800;color:#1a2a4a;margin-bottom:4px">Finalise batches</div>` +
                batches.map(b => `
                <div class="tf-batch">
                    <span>${new Date(b.created_at).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' })}
                          · ${b.team_count} team${b.team_count === 1 ? '' : 's'}, ${b.student_count} students${b.reverted_at ? ' · reverted' : ''}</span>
                    <button ${b.reverted_at ? 'disabled' : ''} onclick="revertBatch('${esc(b.batch_id)}', ${b.team_count})">Revert</button>
                </div>`).join('');
        } catch (e) { el.innerHTML = `<p style="color:#e94560">${esc(e.message)}</p>`; }
    }

    async function revertBatch(batchId, teamCount) {
        if (!confirm(`Revert this batch? The ${teamCount} team${teamCount === 1 ? '' : 's'} it finalised go back to exactly how they were before the save, including any "place me anywhere" declarations.`)) return;
        try {
            await post(`/api/units/${unitId}/finalise-batches/${batchId}/revert`, {});
            await loadTeams();
            await loadBatches();
        } catch (e) { alert(e.message); }
    }

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function loadTeams() {
        try {
            allTeams = await get(`/api/units/${unitId}/all-teams`);
            renderTabs();
            renderActiveSection();
            renderSummary();
        } catch(e) {
            document.getElementById('teams-sections').innerHTML =
                `<p class="t-empty">Error: ${e.message}</p>`;
        }
    }

    function studentCountFor(status) {
        return allTeams
            .filter(t => t.status === status)
            .reduce((sum, t) => sum + t.members.length, 0);
    }

    function renderTabs() {
        const visible = STATUS_GROUPS.filter(g =>
            !g.hideWhenEmpty || allTeams.some(t => t.status === g.key)
        );
        // If the active tab is hidden (e.g. no SUBMITTED on load), fall back to the first visible one.
        if (!visible.some(g => g.key === activeStatus) && visible.length) {
            activeStatus = visible[0].key;
        }
        document.getElementById('status-tabs').innerHTML = visible.map(g => {
            const teamCount    = allTeams.filter(t => t.status === g.key).length;
            const studentCount = studentCountFor(g.key);
            return `
              <button class="tf-tab ${g.cls} ${activeStatus === g.key ? 'active' : ''}"
                      onclick="selectStatus('${g.key}')">
                <div class="tf-tab-label">${g.label}</div>
                <div class="tf-tab-count">
                  <strong>${studentCount}</strong> student${studentCount !== 1 ? 's' : ''}
                  · ${teamCount} team${teamCount !== 1 ? 's' : ''}
                </div>
              </button>`;
        }).join('');
    }

    function selectStatus(key) {
        activeStatus = key;
        renderTabs();
        renderActiveSection();
    }

    function renderActiveSection() {
        const container = document.getElementById('teams-sections');
        if (!allTeams.length) {
            container.innerHTML = '<p class="t-empty">No teams currently in this unit.</p>';
            return;
        }
        const teams = allTeams.filter(t => t.status === activeStatus);
        if (!teams.length) {
            container.innerHTML = `<p class="tf-section-empty">No ${activeStatus.toLowerCase()} teams yet.</p>`;
            return;
        }
        container.innerHTML = `${markLegend(['ok', 'bad', 'info'])}<div class="tf-grid">${teams.map(cardHtml).join('')}</div>`;
    }

    function cardHtml(team) {
        const v = team.validation;
        const statusClass = `tf-status-${team.status.toLowerCase()}`;
        return `
            <div class="tf-team-card">
                <div class="tf-team-id">
                    ${team.team_name || team.team_id.slice(0,8)}
                    <span class="tf-status-badge ${statusClass}">${STATUS_LABEL[team.status] || team.status}</span>
                </div>
                <div class="tf-val-row">
                    <div class="tf-dot ${sizeDotClass(v)}"></div>
                    ${statusMark(sizeKind(v))} ${sizeText(v, team.members.length)}
                </div>
                <div class="tf-val-row">
                    <div class="tf-dot ${violates(v, 'NO_SHARED_TUTORIAL') ? 'tf-dot-red' : v.tutorialShared ? 'tf-dot-green' : 'tf-dot-amber'}"></div>
                    ${statusMark(v.tutorialRequired === false ? 'info' : violates(v, 'NO_SHARED_TUTORIAL') ? 'bad' : v.tutorialShared ? 'ok' : 'info')}
                    ${v.tutorialRequired === false ? 'Shared tutorial not required'
                        : v.tutorialShared ? `Members share ${v.sharedTutorials[0]}`
                        : 'No shared tutorial slot'}
                </div>
                ${v.maxNewToQut == null ? '' : `
                <div class="tf-val-row">
                    <div class="tf-dot ${violates(v, 'NEW_TO_QUT_CAP') ? 'tf-dot-red' : 'tf-dot-green'}"></div>
                    ${statusMark(violates(v, 'NEW_TO_QUT_CAP') ? 'bad' : 'ok')} New-to-QUT students: ${v.newToQutCount} / ${v.maxNewToQut}
                </div>`}
                <button class="tf-view-btn" onclick="viewTeam('${team.team_id}')">View Team</button>
            </div>`;
    }

    // Size is advisory: under target is amber with the target named, over the
    // maximum is red. Only a broken hard rule turns a row red.
    const violates = (v, code) => (v.violations || []).some(x => x.code === code);
    const targetLabel = () => sizeRangeLabel(unitInfo?.valid_team_sizes);
    const sizeDotClass = v => v.sizeState === 'COMPLETE' ? 'tf-dot-green'
        : v.sizeState === 'OVER_MAX' ? 'tf-dot-red' : 'tf-dot-amber';
    const sizeKind = v => v.sizeState === 'COMPLETE' ? 'ok' : v.sizeState === 'OVER_MAX' ? 'bad' : 'info';
    const sizeText = (v, n) => v.sizeState === 'COMPLETE'
        ? `Team has ${n} student${n !== 1 ? 's' : ''} — complete`
        : v.sizeState === 'OVER_MAX' ? `Team has ${n} students — over the maximum`
        : `Group of ${n} — target ${targetLabel()}`;

    function renderSummary() {
        const total     = allTeams.length;
        const open      = allTeams.filter(t => t.status === 'OPEN').length;
        const finalised = allTeams.filter(t => t.status === 'FINALISED').length;
        const breaching = allTeams.filter(t => t.members.length >= 2 && (t.validation.violations || []).length).length;
        document.getElementById('summary-rows').innerHTML = `
            <div class="t-progress-row">
                <div class="t-dot t-dot-green"></div>
                <span class="t-progress-label">Total teams</span>
                <span class="t-progress-stat green">${total}</span>
            </div>
            <div class="t-progress-row">
                <div class="t-dot" style="background:#2663ff"></div>
                <span class="t-progress-label">Open</span>
                <span class="t-progress-stat" style="color:#2663ff">${open}</span>
            </div>
            <div class="t-progress-row">
                <div class="t-dot t-dot-green"></div>
                <span class="t-progress-label">Finalised</span>
                <span class="t-progress-stat green">${finalised}</span>
            </div>
            ${breaching ? `
            <div class="t-progress-row">
                <div class="t-dot" style="background:#e94560"></div>
                <span class="t-progress-label">Breaking a rule</span>
                <span class="t-progress-stat" style="color:#e94560">${breaching}</span>
            </div>` : ''}`;
    }

    function viewTeam(teamId) {
        const team = allTeams.find(t => t.team_id === teamId);
        if (!team) return;
        const v = team.validation;
        const finalised = team.status === 'FINALISED';
        const broken = (v.violations || []).length > 0;
        document.getElementById('modal-body').innerHTML = `
            <h3>${team.team_name || 'Team'} <span class="tf-status-badge tf-status-${team.status.toLowerCase()}">${STATUS_LABEL[team.status] || team.status}</span></h3>
            <p style="font-size:13px;color:#888;margin-bottom:14px">ID: ${team.team_id}</p>
            <div style="background:#7ec8e3;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;color:#fff;display:inline-block;margin-bottom:12px">Members</div>
            ${team.members.map((m, i) => `
                <div class="tf-member-row">
                    <span style="min-width:18px;color:#888">${i+1}.</span>
                    <span style="flex:1;font-weight:600">${m.name || m.student_id}</span>
                    <span style="color:#555;min-width:120px">${m.role || '—'}</span>
                </div>`).join('')}
            <div style="margin-top:16px;font-size:13px;color:#555">
                <strong>Size:</strong> ${sizeText(v, team.members.length)}<br>
                <strong>Shared tutorial:</strong> ${v.sharedTutorials[0] || 'None'}
            </div>
            ${broken ? `
            <div style="margin-top:10px;background:#fdecee;border:1.5px solid #e94560;border-radius:8px;padding:8px 12px;font-size:12px;color:#a8253a">
                ${v.violations.map(x => `<div><strong>${x.rule}</strong> — ${x.why}</div>`).join('')}
                <div style="margin-top:4px">The students see this on My Team. It cannot be finalised until fixed.</div>
            </div>` : ''}
            <p style="font-size:12px;color:#666;margin-top:14px">These are overrides. Groups record themselves when everyone
               accepts a team-up request; you only step in here by exception.</p>
            <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap">
                ${finalised
                    ? `<button class="tf-reject-btn" onclick="overrideTeam('${teamId}','reopen')">Reopen</button>`
                    : `<button class="tf-approve-btn" ${broken ? 'disabled title="Fix the rule breach first"' : ''} onclick="overrideTeam('${teamId}','finalise')">Finalise</button>`}
                ${team.members.length >= 2 ? `<button class="tf-reject-btn" onclick="overrideTeam('${teamId}','dissolve')">Dissolve</button>` : ''}
            </div>
        `;
        document.getElementById('teamModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('teamModal').classList.remove('open');
    }

    const ACTION_PROMPT = {
        finalise: 'Finalise this team? Its members will be notified and can no longer change it. You can reopen it later.',
        reopen:   'Reopen this team? Its members can change it again until the deadline; after the deadline, use Dissolve or the organiser.',
        dissolve: 'Dissolve this team? Every member goes back to being on their own. Their "place me anywhere" declarations are kept.',
    };

    async function overrideTeam(teamId, action) {
        if (!confirm(ACTION_PROMPT[action])) return;
        try {
            await put(`/api/units/${unitId}/teams/${teamId}/override`, { action });
            closeModal();
            await loadTeams();
            await loadBatches();
        } catch(e) { alert(e.message); }
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>

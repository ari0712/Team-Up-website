<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <link rel="stylesheet" href="/assets/css/profile.css">
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Student Profile</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="teacher-sidebar"></nav>
    <main class="fp-shell">
        <section class="fp-card" id="fp-card">
            <p style="color:#888">Loading…</p>
        </section>
    </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/teacher-nav.js"></script>
<script src="/assets/js/profile-view.js"></script>
<script>
    // The coordinator's read-only view of what a student wrote about themselves.
    // Deliberately has no edit affordance: the text belongs to the student, and
    // this page only ever reads it.
    //
    // Everything on screen is rendered by the shared helpers in profile-view.js,
    // from the shape the server builds for the student pages too — so a teacher
    // reads exactly what a classmate reads.

    // Where the teacher came from. Drives both the Back button and the
    // highlighted sidebar item, so landing here does not move them elsewhere in
    // the nav. Whitelisted, so a junk value cannot break the sidebar.
    const ORIGINS = {
        'class-list':     { href: '/teacher/class-list.html',     back: 'Back to Class List' },
        'team-formation': { href: '/teacher/team-formation.html', back: 'Back to Team Formation' },
    };

    (async () => {
        const params = new URLSearchParams(location.search);
        const unitId = params.get('unitId');
        const studentId = params.get('studentId');
        const from = params.get('from');
        const origin = ORIGINS[from] ? from : 'class-list';

        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        buildTeacherSidebar(origin, unitId);

        if (!unitId || !studentId) { window.location = '/teacher/home.html'; return; }

        const profile = await get(
            `/api/units/${unitId}/students/${encodeURIComponent(studentId)}/profile`);

        document.getElementById('page-title').textContent = `${profile.name}'s Profile`;
        document.title = `${profile.name} - TeamUp`;

        // Team Formation hands over which tab was selected and which team's
        // dialog was open; pass it straight back so Back restores that view
        // rather than dropping the coordinator at the top of the page.
        const back = new URLSearchParams({ unitId });
        for (const key of ['tab', 'team']) {
            if (params.get(key)) back.set(key, params.get(key));
        }
        const backHref = `${ORIGINS[origin].href}?${back}`;
        document.getElementById('fp-card').innerHTML = `
          ${profileHeaderHtml(profile)}
          <hr class="fp-divider">
          ${profileAboutHtml(profile.about)}
          <div class="fp-actions">
            <button class="t-open-btn" style="width:210px;background:#1a2a4a"
                    onclick="window.location='${backHref}'">${esc(ORIGINS[origin].back)}</button>
          </div>`;
    })().catch(err => {
        document.getElementById('fp-card').innerHTML =
            `<p style="color:#e94560;font-weight:600">Could not load this profile: ${esc(err.message)}</p>`;
    });

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

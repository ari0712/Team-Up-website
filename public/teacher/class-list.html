<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Class List</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        body.t-page { min-height: 100vh; height: auto; overflow: visible; }
        .t-dashboard-layout { min-height: auto; }
        .t-dash-content { overflow: visible; }
        .cl-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .cl-student-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px 14px;
            border: 1.5px solid #d0dff0;
            display: flex;
            flex-direction: column;
        }
        .cl-student-name {
            font-size: 16px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 14px;
        }
        .cl-stage-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #1a2a4a;
            margin-bottom: 6px;
        }
        .cl-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .cl-dot-green { background: #22c55e; }
        .cl-dot-red   { background: #e94560; }
        .cl-dot-gray  { background: #ccc; }
        .cl-profile-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            background: #2663ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cl-profile-btn:hover { background: #1a4fcc; }
        .cl-search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .cl-search-input {
            flex: 1;
            min-width: 200px;
            border: 1.5px solid #d0dff0;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 14px;
            outline: none;
        }
        .cl-filter-select {
            border: 1.5px solid #d0dff0;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }
        .cl-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 20px 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a4a;
        }
        .cl-pagination button {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #2663ff;
            cursor: pointer;
            padding: 4px 8px;
        }
        .cl-pagination button:disabled { color: #aaa; cursor: default; }
        /* Profile modal */
        .cl-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .cl-modal-overlay.open { display: flex; }
        .cl-modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 440px;
            width: 90%;
        }
        .cl-modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: #1a2a4a; }
        .cl-modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            margin-top: -4px;
        }
        .cl-modal-field { font-size: 13px; color: #555; margin: 6px 0; }
        .cl-modal-field strong { color: #1a2a4a; }
    </style>
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Class List</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span>
    </a>
</header>

<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="teacher-sidebar"></nav>

    <main class="t-dash-content">
        <div class="cl-search-row">
            <input id="search-input" class="cl-search-input" type="text"
                   placeholder="Search by name or student ID…" oninput="applyFilters()">
            <select id="filter-stage" class="cl-filter-select" onchange="applyFilters()">
                <option value="">All students</option>
                <option value="read_rules">Read rules</option>
                <option value="entered_preferences">Entered preferences</option>
                <option value="in_team">In a team</option>
                <option value="submitted_request">Submitted request</option>
                <option value="teacher_approved">Teacher approved</option>
            </select>
        </div>

        <div id="student-grid" class="cl-grid">
            <p class="t-empty">Loading students…</p>
        </div>
        <div class="cl-pagination">
            <button id="prevBtn" onclick="changePage(-1)" disabled>← Prev Page</button>
            <span id="pageLabel">Page 1</span>
            <button id="nextBtn" onclick="changePage(1)">Next Page →</button>
        </div>
    </main>

    <div class="t-vert-divider"></div>

    <aside class="t-progress-aside">
        <h2 class="t-progress-heading">Class Progress</h2>
        <div id="summary-rows" class="t-progress-rows"></div>

        <h2 class="t-progress-heading" style="margin-top:28px">Who Can Join</h2>
        <p style="font-size:12px;color:#5a7a9a;line-height:1.5;margin-bottom:10px">
            Only these email addresses can see and join this unit.
            <strong id="roster-empty-warn" style="color:#e94560;display:none">
                With nobody listed, the unit is hidden from all students.</strong>
        </p>
        <div id="roster-list" style="font-size:13px;margin-bottom:12px">Loading…</div>
        <textarea id="roster-input" rows="3" placeholder="student@qut.edu.au, another@qut.edu.au"
                  style="width:100%;border:1.5px solid #d0dff0;border-radius:8px;padding:8px 10px;
                         font-size:13px;box-sizing:border-box;resize:vertical"></textarea>
        <p id="roster-msg" class="t-save-msg" style="text-align:left"></p>
        <button class="t-open-btn" style="margin-top:6px" onclick="addToRoster()">Add to Class List</button>
    </aside>
</div>

<!-- Profile modal -->
<div class="cl-modal-overlay" id="profileModal">
    <div class="cl-modal">
        <button class="cl-modal-close" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/teacher-nav.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const unitId = params.get('unitId');
    const PAGE_SIZE = 8;
    let allStudents = [], filteredStudents = [], currentPage = 1;

    const STAGES = [
        { key: 'read_rules',          label: 'Read rules' },
        { key: 'entered_preferences', label: 'Enter preferences' },
        { key: 'in_team',             label: 'Build or join team' },
        { key: 'submitted_request',   label: 'Submit team request' },
        { key: 'teacher_approved',    label: 'Teacher review' },
    ];

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        if (!unitId) { window.location = '/teacher/home.html'; return; }
        buildTeacherSidebar('class-list');
        await Promise.all([loadStudents(), loadRoster()]);
    })();

    // ── Class list / roster: who is allowed to join at all ──────────────
    async function loadRoster() {
        const list = document.getElementById('roster-list');
        try {
            const roster = await get(`/api/units/${unitId}/roster`);
            document.getElementById('roster-empty-warn').style.display = roster.length ? 'none' : 'inline';
            if (!roster.length) {
                list.innerHTML = `<p style="color:#888">Nobody added yet.</p>`;
                return;
            }
            list.innerHTML = roster.map(r => `
                <div style="display:flex;align-items:center;gap:8px;padding:5px 0;
                            border-bottom:1px solid #eef4fb">
                  <!-- Always the email: it is the key the allowlist matches on,
                       so showing a name here would misrepresent what grants
                       access. The name (when the roster has one) is the tooltip. -->
                  <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
                               white-space:nowrap"
                        title="${escapeAttr(r.name ? r.name + ' — ' + r.email : r.email)}">
                    ${escapeHtml(r.email)}
                  </span>
                  <span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
                        ${r.joined ? 'background:#e7f9ee;color:#16a34a' : 'background:#f0f0f0;color:#777'}">
                    ${r.joined ? 'joined' : 'invited'}
                  </span>
                  <button onclick="removeFromRoster('${escapeAttr(r.email)}')"
                          style="background:none;border:none;color:#e94560;cursor:pointer;
                                 font-size:14px;line-height:1" title="Remove">✕</button>
                </div>`).join('');
        } catch(e) {
            list.innerHTML = `<p style="color:#e94560">Could not load: ${escapeHtml(e.message)}</p>`;
        }
    }

    const escapeHtml = v => String(v ?? '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const escapeAttr = v => escapeHtml(v);

    async function addToRoster() {
        const box = document.getElementById('roster-input');
        const msg = document.getElementById('roster-msg');
        const emails = box.value.split(/[,\s;]+/).map(s => s.trim()).filter(Boolean);
        if (!emails.length) {
            msg.style.color = '#e94560'; msg.textContent = 'Enter at least one email address.';
            return;
        }
        try {
            const r = await post(`/api/units/${unitId}/roster`, {
                students: emails.map(email => ({ email }))
            });
            msg.style.color = '#22c55e';
            msg.textContent = `Added ${r.added}${r.skipped ? `, skipped ${r.skipped} invalid` : ''}.`;
            box.value = '';
            await loadRoster();
        } catch(e) { msg.style.color = '#e94560'; msg.textContent = e.message; }
    }

    async function removeFromRoster(email) {
        if (!confirm(`Remove ${email} from the class list?\n\nIf they have already joined they keep their place; this only stops future joins.`)) return;
        try {
            // api.js's del() takes no body; call the core helper directly.
            await api('DELETE', `/api/units/${unitId}/roster`, { email });
            await loadRoster();
        } catch(e) { alert('Could not remove: ' + e.message); }
    }

    async function loadStudents() {
        try {
            allStudents = await get(`/api/units/${unitId}/class-list`);
            filteredStudents = [...allStudents];
            renderPage();
            renderSummary();
        } catch(e) {
            document.getElementById('student-grid').innerHTML =
                `<p class="t-empty">Error: ${e.message}</p>`;
        }
    }

    function applyFilters() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const stage  = document.getElementById('filter-stage').value;
        filteredStudents = allStudents.filter(s => {
            const nameMatch = (s.name || s.student_id).toLowerCase().includes(search);
            const stageMatch = !stage || s[stage] == 1;
            return nameMatch && stageMatch;
        });
        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        const start = (currentPage - 1) * PAGE_SIZE;
        const page  = filteredStudents.slice(start, start + PAGE_SIZE);
        const grid  = document.getElementById('student-grid');

        if (!filteredStudents.length) {
            grid.innerHTML = '<p class="t-empty">No students found.</p>';
            updatePagination();
            return;
        }

        grid.innerHTML = page.map(s => {
            const rows = STAGES.map(st => {
                const done   = s[st.key] == 1;
                const locked = st.key === 'teacher_approved' && !s.submitted_request;
                const dotCls = locked ? 'cl-dot-gray' : (done ? 'cl-dot-green' : 'cl-dot-red');
                return `<div class="cl-stage-row">
                    <div class="cl-dot ${dotCls}"></div>
                    <span>${st.label}</span>
                </div>`;
            }).join('');
            return `
            <div class="cl-student-card">
                <div class="cl-student-name">${s.name || s.student_id}</div>
                ${rows}
                <button class="cl-profile-btn" onclick='viewProfile(${JSON.stringify(s)})'>View Profile</button>
            </div>`;
        }).join('');

        updatePagination();
    }

    function updatePagination() {
        const totalPages = Math.max(1, Math.ceil(filteredStudents.length / PAGE_SIZE));
        document.getElementById('pageLabel').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage();
    }

    function renderSummary() {
        const total = allStudents.length;
        const rows  = STAGES.map(st => {
            const count = allStudents.filter(s => s[st.key] == 1).length;
            const done  = total > 0 && count >= total;
            return `<div class="t-progress-row">
                <div class="t-dot ${done ? 't-dot-green' : 't-dot-red'}"></div>
                <span class="t-progress-label">${st.label}</span>
                <span class="t-progress-stat ${done ? 'green' : 'red'}">${count} / ${total}</span>
            </div>`;
        }).join('');
        document.getElementById('summary-rows').innerHTML = rows;
    }

    function viewProfile(s) {
        document.getElementById('modal-body').innerHTML = `
            <h3>${s.name || s.student_id}</h3>
            <p style="font-size:13px;color:#888;margin-bottom:14px">ID: ${s.student_id}</p>
            <div class="cl-modal-field"><strong>Tutorial time:</strong> ${s.tutorial_time || s.tutorial_slots || '—'}</div>
            <div class="cl-modal-field"><strong>Degree:</strong> ${s.degree || '—'}</div>
            <div class="cl-modal-field"><strong>Major:</strong> ${s.major || '—'}</div>
            <div class="cl-modal-field"><strong>New to QUT:</strong> ${s.is_new_to_qut ? 'Yes' : 'No'}</div>
            <div class="cl-modal-field"><strong>Skills:</strong> ${s.skills || 'Not yet filled in'}</div>
            <div class="cl-modal-field"><strong>Preferred role:</strong> ${s.preferred_role || 'Not yet filled in'}</div>
            <div class="cl-modal-field"><strong>Project interests:</strong> ${s.project_interests || 'Not yet filled in'}</div>
            <div style="margin-top:16px">
                ${STAGES.map(st => {
            const done   = s[st.key] == 1;
            const locked = st.key === 'teacher_approved' && !s.submitted_request;
            const dotCls = locked ? 'cl-dot-gray' : (done ? 'cl-dot-green' : 'cl-dot-red');
            return `<div class="cl-stage-row">
                        <div class="cl-dot ${dotCls}"></div>
                        <span style="font-size:13px">${st.label}</span>
                    </div>`;
        }).join('')}
            </div>`;
        document.getElementById('profileModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('profileModal').classList.remove('open');
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

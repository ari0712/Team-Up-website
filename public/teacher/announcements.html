<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Announcements</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        body.t-page { min-height: 100vh; height: auto; overflow: visible; }
        .t-dashboard-layout { min-height: auto; }
        .t-dash-content { overflow: visible; }
        .ann-banner {
            background: #e8635a;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 22px;
        }
        .ann-form-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px 28px;
            border: 1.5px solid #d0dff0;
            margin-bottom: 20px;
        }
        .ann-form-card h3 {
            font-size: 18px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 18px;
        }
        .ann-field-row {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 16px;
        }
        .ann-field-label {
            font-size: 14px;
            font-weight: 700;
            color: #1a2a4a;
            min-width: 80px;
            padding-top: 10px;
        }
        .ann-input {
            flex: 1;
            border: 1.5px solid #d0dff0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .ann-input:focus { border-color: #2663ff; }
        .ann-textarea {
            flex: 1;
            border: 1.5px solid #d0dff0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            min-height: 180px;
            resize: vertical;
            font-family: inherit;
        }
        .ann-textarea:focus { border-color: #2663ff; }
        .ann-post-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .ann-post-btn {
            background: #2663ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 36px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .ann-post-btn:hover { background: #1a4fcc; }
        .ann-history-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            border: 1.5px solid #d0dff0;
        }
        .ann-history-card h3 {
            font-size: 16px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 14px;
        }
        .ann-item {
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 0;
        }
        .ann-item:last-child { border-bottom: none; }
        .ann-item-title { font-size: 14px; font-weight: 700; color: #1a2a4a; margin-bottom: 4px; }
        .ann-item-content { font-size: 13px; color: #555; margin-bottom: 4px; }
        .ann-item-date { font-size: 11px; color: #aaa; }
        .ann-empty { font-size: 13px; color: #aaa; }
    </style>
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Announcements</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span>
    </a>
</header>

<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="teacher-sidebar"></nav>

    <main class="t-dash-content">
        <div class="ann-banner">Edit Current / Set Deadline</div>

        <div class="ann-form-card">
            <h3>Create Unit Announcement</h3>
            <div class="ann-field-row">
                <label class="ann-field-label">Title:</label>
                <input id="ann-title" class="ann-input" type="text"
                       placeholder="e.g. 2 days left until Groups are Finalised!">
            </div>
            <div class="ann-field-row">
                <label class="ann-field-label">Contents:</label>
                <textarea id="ann-content" class="ann-textarea"
                          placeholder="Be sure to finalise your profile and complete the progression checkpoints."></textarea>
            </div>
            <p id="ann-error" style="color:#e94560;font-size:13px;min-height:18px"></p>
            <div class="ann-post-row">
                <button class="ann-post-btn" onclick="postAnnouncement()">Post</button>
            </div>
        </div>

        <div class="ann-history-card">
            <h3>Previous Announcements</h3>
            <div id="ann-history"><p class="ann-empty">Loading…</p></div>
        </div>
    </main>

    <div class="t-vert-divider"></div>

    <aside class="t-progress-aside" style="padding:28px 24px">
        <h2 class="t-progress-heading">Quick Actions</h2>
        <p style="font-size:13px;color:#5a7a9a;margin-bottom:16px">Update the unit deadline directly from the dashboard.</p>
        <button class="t-view-progress-btn" onclick="window.location='/teacher/dashboard.html?unitId='+unitId">
            Go to Dashboard
        </button>
    </aside>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/teacher-nav.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const unitId = params.get('unitId');

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        if (!unitId) { window.location = '/teacher/home.html'; return; }
        buildTeacherSidebar('announcements');
        await loadHistory();
    })();

    async function loadHistory() {
        try {
            const list = await get(`/api/units/${unitId}/announcements`);
            const el   = document.getElementById('ann-history');
            if (!list.length) {
                el.innerHTML = '<p class="ann-empty">No announcements posted yet.</p>';
                return;
            }
            el.innerHTML = list.map(a => {
                const date = new Date(a.created_at).toLocaleString('en-AU', {
                    day:'numeric', month:'short', year:'numeric',
                    hour:'numeric', minute:'2-digit'
                });
                return `<div class="ann-item">
                    <div class="ann-item-title">${a.title}</div>
                    <div class="ann-item-content">${a.content || ''}</div>
                    <div class="ann-item-date">${date}</div>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('ann-history').innerHTML =
                `<p class="ann-empty">Error: ${e.message}</p>`;
        }
    }

    async function postAnnouncement() {
        const title   = document.getElementById('ann-title').value.trim();
        const content = document.getElementById('ann-content').value.trim();
        const errEl   = document.getElementById('ann-error');
        errEl.textContent = '';
        if (!title) { errEl.textContent = 'Title is required.'; return; }
        try {
            await post(`/api/units/${unitId}/announcements`, { title, content });
            document.getElementById('ann-title').value   = '';
            document.getElementById('ann-content').value = '';
            await loadHistory();
        } catch(e) { errEl.textContent = e.message; }
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

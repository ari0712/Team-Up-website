<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements – TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        body.t-page { min-height: 100vh; height: auto; overflow: visible; }
        .t-dashboard-layout { min-height: auto; }
        .t-dash-content { overflow: visible; }

        .sa-wrap {
            max-width: 760px;
            margin: 0 auto;
        }
        .sa-intro {
            font-size: 13px;
            color: #555;
            margin: -4px 0 18px;
        }
        .sa-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            border: 1.5px solid #d0dff0;
            margin-bottom: 14px;
        }
        .sa-title {
            font-size: 16px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 6px;
        }
        .sa-content {
            font-size: 14px;
            color: #2a3a4a;
            line-height: 1.55;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        .sa-date {
            font-size: 12px;
            color: #8aabbf;
            font-weight: 600;
        }
        .sa-empty {
            background: #f7fbff;
            border: 1.5px dashed #a9c8dc;
            border-radius: 12px;
            padding: 28px 22px;
            color: #5a7a9a;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Announcements</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>

<div class="t-divider"></div>

<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <main class="t-dash-content">
        <div class="sa-wrap">
            <h2 style="font-size:19px;font-weight:800;margin-bottom:4px">Unit Announcements</h2>
            <p class="sa-intro">Updates and reminders from your teacher, newest first.</p>
            <div id="sa-list"><p style="color:#888">Loading…</p></div>
        </div>
    </main>
</div>

<footer class="t-footer">High Fidelity Design Concept.</footer>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/student-nav.js"></script>
<script>
    const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    function formatDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return value;
        return d.toLocaleString('en-AU', {
            day: 'numeric', month: 'short', year: 'numeric',
            hour: 'numeric', minute: '2-digit'
        });
    }

    (async () => {
        const nav = await initStudentNav({ activeItem: 'announcements', pageTitle: 'Announcements' });
        if (!nav) return;
        const { unitId } = nav;

        const listEl = document.getElementById('sa-list');
        if (!unitId) {
            listEl.innerHTML = `<div class="sa-empty">Open a unit from the Home page to see its announcements.</div>`;
            return;
        }

        try {
            const items = await get(`/api/student/units/${unitId}/announcements`);
            if (!items.length) {
                listEl.innerHTML = `<div class="sa-empty">No announcements yet. Check back later.</div>`;
                return;
            }
            listEl.innerHTML = items.map(a => `
                <div class="sa-card">
                    <div class="sa-title">${escapeHtml(a.title)}</div>
                    ${a.content ? `<div class="sa-content">${escapeHtml(a.content)}</div>` : ''}
                    <div class="sa-date">${escapeHtml(formatDate(a.created_at))}</div>
                </div>
            `).join('');
        } catch (e) {
            listEl.innerHTML = `<div class="sa-empty">Could not load announcements: ${escapeHtml(e.message)}</div>`;
        }
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Profile - TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <link rel="stylesheet" href="/assets/css/profile.css">
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Full Profile</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <main class="fp-shell">
        <section class="fp-card" id="fp-card">
            <p style="color:#888">Loading…</p>
        </section>
    </main>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/student-nav.js"></script>
<script src="/assets/js/profile-view.js"></script>
<script>
    let unitId, viewedId, profile;
    let editing = false;
    // Where the student came from. Drives both the highlighted sidebar item and
    // the Back button: this page is reachable from three places, and landing on
    // it should not move you somewhere else in the nav. Carried in the URL
    // because the sidebar is built before we know whose profile this is.
    let origin = 'profile';
    // Held until Save so the photo and the text commit together. `null` means
    // untouched; '' means the student asked to remove it.
    let pendingAvatar = null;

    // The three places this page is reached from. Keys double as sidebar nav
    // keys, so the item you arrived through stays highlighted.
    const ORIGINS = {
        'profile':        { href: '/student/profile.html',        back: 'Back to My Profile' },
        'find-teammates': { href: '/student/find-teammates.html', back: 'Back to Find Teammates' },
        'my-team':        { href: '/student/my-team.html',        back: 'Back to My Team' },
    };

    // Photo controls, spelled out rather than left as two bare buttons.
    //
    // Removing is staged like everything else on this page — it only takes
    // effect on Save — so the pending state has to say so out loud, and has to
    // be undoable without throwing away unsaved text via Cancel.
    function photoControlsHtml(src) {
        const removalPending = pendingAvatar === '';
        const newPhotoPicked = !!pendingAvatar;

        let note;
        if (removalPending)      note = 'Your photo will be removed when you save — your initials are shown instead.';
        else if (newPhotoPicked) note = 'New photo ready — choose Save Changes to keep it.';
        else if (src)            note = 'JPEG or PNG. Removing your photo goes back to your initials.';
        else                     note = 'No photo yet — your initials are shown instead. JPEG or PNG.';

        return `
      <div class="fp-photo-controls">
        <span class="fp-photo-label">Profile photo</span>
        <div class="fp-photo-actions">
          <button class="fp-btn-sm" onclick="document.getElementById('fp-photo').click()">
            ${src ? 'Change photo' : 'Add photo'}</button>
          ${src ? `<button class="fp-btn-sm danger" onclick="removePhoto()">Remove photo</button>` : ''}
          ${removalPending && profile.avatarPath
            ? `<button class="fp-btn-sm" onclick="undoRemovePhoto()">Undo remove</button>` : ''}
          <input type="file" id="fp-photo" accept="image/jpeg,image/png" style="display:none"
                 onchange="onPhotoChosen(this)">
        </div>
        <div class="fp-photo-note${removalPending ? ' warn' : ''}">${esc(note)}</div>
      </div>`;
    }

    // The identity block is the shared one (profile-view.js); only the photo
    // controls are this page's, and only while editing.
    function headerHtml() {
        const src = pendingAvatar !== null ? pendingAvatar : profile.avatarPath;
        return profileHeaderHtml(profile, {
            src, extraHtml: editing ? photoControlsHtml(src) : ''
        });
    }

    function render() {
        const backHref = `${ORIGINS[origin].href}?unitId=${unitId}`;

        const body = editing
            ? profile.about.map(field => `
      <div class="fp-section">
        <div class="fp-section-title">${esc(field.label)}</div>
        <textarea class="fp-textarea" id="fld-${esc(field.key)}" maxlength="2000"
                  oninput="updateCount('${esc(field.key)}')"
                  placeholder="Optional — leave blank if you'd rather not say.">${esc(field.value)}</textarea>
        <div class="fp-count" id="cnt-${esc(field.key)}"></div>
      </div>`).join('')
            : profileAboutHtml(profile.about);

        document.getElementById('fp-card').innerHTML = `
      ${headerHtml()}
      <hr class="fp-divider">
      ${editing
          ? `<p class="fp-hint">Every question below is optional — fill in what you want your
               classmates and your teaching team to know, and leave the rest blank. This stays
               editable even after your team is finalised.</p>`
          : ''}
      ${body}
      <div class="fp-actions">
        ${editing ? `
          <button class="t-open-btn" style="width:180px" onclick="save()">Save Changes</button>
          <button class="t-open-btn" style="width:140px;background:#888" onclick="cancelEdit()">Cancel</button>`
        : `
          ${profile.isSelf
            ? `<button class="t-open-btn" style="width:180px" onclick="startEdit()">Edit My Profile</button>`
            : ''}
          <button class="t-open-btn" style="width:190px;background:#1a2a4a"
                  onclick="window.location='${backHref}'">${esc(ORIGINS[origin].back)}</button>`}
      </div>
      <div class="fp-msg" id="fp-msg"></div>`;

        if (editing) profile.about.forEach(f => updateCount(f.key));
    }

    function updateCount(key) {
        const box = document.getElementById(`fld-${key}`);
        const out = document.getElementById(`cnt-${key}`);
        if (!box || !out) return;
        const n = box.value.length;
        out.textContent = `${n} / 2000`;
        out.classList.toggle('over', n >= 2000);
    }

    function message(text, kind) {
        const el = document.getElementById('fp-msg');
        if (!el) return;
        el.textContent = text;
        el.style.color = kind === 'error' ? '#e94560' : kind === 'ok' ? '#22c55e' : '#5a7a9a';
    }

    function startEdit() { editing = true; pendingAvatar = null; render(); }

    function cancelEdit() {
        editing = false;
        pendingAvatar = null;   // discards an unsaved photo along with unsaved text
        render();
    }

    function removePhoto() {
        pendingAvatar = '';
        render();
        message('Photo will be removed when you save.', 'info');
    }

    // Reverts a staged removal without discarding unsaved text, which is what
    // Cancel would cost. null means "leave the stored photo alone".
    function undoRemovePhoto() {
        pendingAvatar = null;
        render();
        message('Your photo will be kept.', 'info');
    }

    // Downscale in the browser so a 5 MB phone photo becomes ~20 KB before it is
    // ever sent. Keeps the upload inside the JSON transport in api.js — no
    // multipart handling, and no huge bodies to police server-side.
    function onPhotoChosen(input) {
        const file = input.files[0];
        input.value = '';                    // so re-picking the same file re-fires
        if (!file) return;
        if (!/^image\/(jpeg|png)$/.test(file.type)) {
            message('Please choose a JPEG or PNG image.', 'error');
            return;
        }
        const reader = new FileReader();
        reader.onerror = () => message('That image could not be read.', 'error');
        reader.onload = e => {
            const img = new Image();
            img.onerror = () => message('That image could not be read.', 'error');
            img.onload = () => {
                const SIZE = 256;
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = SIZE;
                // Centre-crop to a square so portraits are not squashed.
                const side = Math.min(img.width, img.height);
                canvas.getContext('2d').drawImage(
                    img, (img.width - side) / 2, (img.height - side) / 2, side, side,
                    0, 0, SIZE, SIZE);
                pendingAvatar = canvas.toDataURL('image/jpeg', 0.8);
                render();
                message('Photo ready — choose Save Changes to keep it.', 'info');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function save() {
        const body = {};
        for (const field of profile.about) {
            body[field.key] = document.getElementById(`fld-${field.key}`).value;
        }
        message('Saving…', 'info');
        try {
            await post(`/api/student/units/${unitId}/profile`, body);

            // Photo second: the text is the substance, and a failed upload should
            // not make it look like nothing saved.
            if (pendingAvatar !== null) {
                if (pendingAvatar === '') {
                    await del('/api/student/avatar');
                    profile.avatarPath = '';
                } else {
                    const r = await post('/api/student/avatar', { dataUrl: pendingAvatar });
                    profile.avatarPath = r.avatarPath;
                }
            }

            profile.about = profile.about.map(f => ({ ...f, value: String(body[f.key] ?? '').trim() }));
            pendingAvatar = null;
            editing = false;
            render();
            message('Profile saved.', 'ok');
        } catch (e) {
            message(e.message, 'error');
        }
    }

    (async () => {
        const params = new URLSearchParams(location.search);
        const requested = params.get('studentId');
        // Whitelisted so a junk value cannot break the sidebar. Links without an
        // origin fall back on the studentId: no id at all means it is your own
        // profile, reached from Your Profile.
        const from = params.get('from');
        origin = ORIGINS[from] ? from : (requested ? 'find-teammates' : 'profile');

        const nav = await initStudentNav({ activeItem: origin, pageTitle: 'Full Profile' });
        if (!nav) return;
        unitId = nav.unitId;
        // No studentId means "my own profile".
        viewedId = requested || nav.user.username;

        profile = await get(`/api/student/units/${unitId}/students/${encodeURIComponent(viewedId)}/profile`);
        document.getElementById('page-title').textContent =
            profile.isSelf ? 'My Full Profile' : `${profile.name}'s Profile`;
        document.title = `${profile.isSelf ? 'My Full Profile' : profile.name} - TeamUp`;
        render();
    })().catch(err => {
        document.getElementById('fp-card').innerHTML =
            `<p style="color:#e94560;font-weight:600">Could not load this profile: ${esc(err.message)}</p>`;
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home – TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Student Home</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span>
    </a>
</header>

<main class="t-main">
    <div id="unitGrid" class="t-unit-grid">
        <p class="t-empty">Loading your units…</p>
    </div>
</main>

<footer class="t-footer">High Fidelity Design Concept.</footer>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/student-nav.js"></script>
<script>
    const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    (async () => {
        const nav = await initStudentNav({ activeItem: 'home', pageTitle: 'Student Home' });
        if (!nav) return;
        const grid = document.getElementById('unitGrid');
        try {
            const units = await get('/api/student/units');
            if (!units.length) {
                // Units are private: you only see one once your teacher has put
                // your email on its class list. Say so, or an excluded student
                // just sees an unexplained blank page.
                grid.innerHTML = `
                    <p class="t-empty" style="line-height:1.6">
                      No units yet.<br>
                      Your teacher adds you to a unit using the email address you
                      signed up with — <strong>${escapeHtml(nav.user.email || nav.user.username)}</strong>.
                      Once they do, the unit appears here.<br>
                      <span style="font-size:13px;color:#8aabbf">
                        If you expected a unit to be listed, check with your teacher
                        that they used this address.
                      </span>
                    </p>`;
                return;
            }
            grid.innerHTML = units.map(u => `
        <div class="t-unit-card">
          <div class="t-unit-body">
            <h3 class="t-unit-name">${u.unit_name}</h3>
            <p class="t-unit-desc">${u.description || ''}</p>
            <p class="t-unit-sem">${u.semester || ''}</p>
          </div>
          ${u.joined
                ? `<button class="t-open-btn"
                 onclick="window.location='/student/dashboard.html?unitId=${u.unit_id}'">
                 Open
               </button>`
                : `<button class="t-open-btn" style="background:#1a2a4a"
                 onclick="joinUnit('${u.unit_id}')">
                 Join Unit
               </button>`
            }
        </div>
      `).join('');
        } catch(e) {
            grid.innerHTML = `<p class="t-empty">Error: ${e.message}</p>`;
        }
    })();
    async function joinUnit(unitId) {
        try {
            await post(`/api/student/units/${unitId}/join`, {});
            // Redirect straight to the rules page — first thing a new joiner should see
            window.location = `/student/rules.html?unitId=${unitId}`;
        } catch(e) {
            alert('Could not join unit: ' + e.message);
        }
    }
</script>
</body>
</html>

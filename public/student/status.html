<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status – TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        .s-card { background:#fff;border-radius:14px;padding:22px 24px;border:1.5px solid #d0dff0;margin-bottom:16px }
        .s-member-row { display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:14px }
        .s-member-row:last-child { border-bottom:none }
        .s-validation { background:#7ec8e3;border-radius:12px;padding:18px 20px }
        .s-val-row { display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:#fff }
        .s-val-dot { width:11px;height:11px;border-radius:50%;flex-shrink:0 }
    </style>
</head>
<body>
<!-- Retired. There is no "submitted" state to report on any more: an accepted
     team-up request is the record, and My Team shows everything about it. Kept
     only so old links and bookmarks land somewhere useful. -->
<script>
    const unitId = new URLSearchParams(location.search).get('unitId');
    location.replace(`/student/my-team.html${unitId ? '?unitId=' + encodeURIComponent(unitId) : ''}`);
</script>
</body>
</html>

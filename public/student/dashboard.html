<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard – TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        .s-card { background:#fff;border-radius:14px;padding:22px 24px;border:1.5px solid #d0dff0;margin-bottom:16px }
        .s-card h3 { font-size:17px;font-weight:800;margin-bottom:6px }
        .s-card p  { font-size:14px;color:#555 }
        .s-dot-gray { background:#ccc !important }
        .s-progress-status { font-size:13px;font-weight:700 }
        .s-progress-status.completed { color:#22c55e }
        .s-progress-status.in-progress { color:#e94560 }
        .s-progress-status.not-started { color:#888 }
        .s-progress-status.locked { color:#aaa }

        .invite-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
            flex-wrap: wrap;
        }
        .invite-row:last-child { border-bottom: none; }
        .invite-info { flex: 1; font-size: 14px; color: #1a2a4a; }
        .invite-info strong { font-weight: 700; }
        .invite-info span { color: #666; font-size: 13px; }
        .invite-actions { display: flex; gap: 8px; }
        .btn-accept {
            background: #22c55e; color: #fff; border: none;
            border-radius: 8px; padding: 7px 18px;
            font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .btn-accept:hover { background: #16a34a; }
        .btn-decline {
            background: #fff; color: #e94560;
            border: 1.5px solid #e94560; border-radius: 8px;
            padding: 7px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .btn-decline:hover { background: #fff0f3; }
        .btn-details {
            background: #fff; color: #2663ff;
            border: 1.5px solid #2663ff; border-radius: 8px;
            padding: 7px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .btn-details:hover { background: #eff4ff; }

        /* ── Request details popup ── */
        .s-details-box {
            max-width: 560px; max-height: 80vh;
            overflow-y: auto; position: relative;
        }
        .s-details-close {
            position: absolute; top: 14px; right: 16px;
            background: none; border: none; font-size: 18px;
            color: #888; cursor: pointer; line-height: 1;
        }
        .s-details-close:hover { color: #1a2a4a; }
        .s-details-title { font-size: 18px; font-weight: 800; color: #1a2a4a; padding-right: 24px; }
        .s-details-sub { font-size: 14px; color: #555; margin-top: 6px; }
        .s-details-meta { font-size: 13px; color: #666; margin-top: 8px; }
        .s-details-meta.warn { color: #e94560; font-weight: 700; }
        .s-detail-section { margin-top: 22px; }
        .s-detail-section-title {
            font-size: 12px; font-weight: 800; letter-spacing: .6px;
            text-transform: uppercase; color: #1a2a4a;
            border-bottom: 1.5px solid #d0dff0; padding-bottom: 6px; margin-bottom: 4px;
        }
        .s-detail-member {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 0; border-bottom: 1px solid #f0f0f0;
            font-size: 14px; color: #1a2a4a; flex-wrap: wrap;
        }
        .s-detail-member:last-child { border-bottom: none; }
        .s-detail-name { flex: 1; min-width: 140px; font-weight: 700; }
        .s-detail-role { font-weight: 400; color: #888; font-size: 13px; }
        .s-vote-chip {
            font-size: 12px; font-weight: 700; padding: 3px 10px;
            border-radius: 20px; background: #f0f0f0; color: #666; white-space: nowrap;
        }
        .s-vote-chip.yes { background: #e7f9ee; color: #16a34a; }
        .s-vote-chip.no { background: #fff0f3; color: #e94560; }
        .s-vote-chip.initiator { background: #eff4ff; color: #2663ff; }
        .s-profile-link {
            font-size: 12px; font-weight: 700; color: #2663ff;
            text-decoration: none; border: 1.5px solid #d0dff0;
            border-radius: 6px; padding: 4px 10px; white-space: nowrap;
        }
        .s-profile-link:hover { border-color: #2663ff; background: #eff4ff; }
        .s-detail-note { font-size: 13px; color: #888; padding: 9px 0; }
        .s-race-warning {
            background: #fff0f3; border: 1.5px solid #e94560;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
            font-size: 13px; font-weight: 600; color: #b3253f; line-height: 1.5;
        }
        .s-details-warning {
            background: #fff0f3; border-left: 3px solid #e94560;
            border-radius: 6px; padding: 9px 12px; margin-top: 12px;
            font-size: 13px; font-weight: 600; color: #b3253f; line-height: 1.5;
        }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">Student Dashboard</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <div class="t-dash-content">
        <!-- Deadline banner -->
        <div class="t-deadline-banner" id="deadline-banner">
            <div>
                <div style="font-size:30px;font-weight:900;color:#fff">Deadline</div>
                <div id="deadline-date" style="font-size:15px;font-weight:700;color:#fff;margin-top:4px"></div>
                <div id="deadline-remaining" style="font-size:14px;color:#fff;opacity:.9;margin-top:2px"></div>
            </div>
            <div class="t-warning-circle">!</div>
        </div>
        <!-- Team Status card -->
        <div class="s-card" id="team-status-card">
            <h3>Team Status</h3>
            <p id="team-status-text">Loading…</p>
            <button class="t-open-btn" style="margin-top:14px;width:160px"
                    onclick="goTo('my-team')">View My Team</button>
        </div>
        <!-- Team-up requests -->
        <div class="s-card" id="invites-card" style="display:none">
            <h3 style="font-size:17px;font-weight:800;margin-bottom:14px">
                📬 Team-up requests
                <span id="invite-count-badge" style="background:#e94560;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px"></span>
            </h3>
            <div id="race-warning" class="s-race-warning" style="display:none"></div>
            <div id="invites-list"></div>
        </div>
        <!-- Find teammates CTA -->
        <div class="s-card">
            <h3>Need help finding a team?</h3>
            <p>You can search manually or let TeamUp suggest teammates.</p>
            <div style="display:flex;gap:12px;margin-top:14px">
                <button class="t-open-btn" style="width:180px" onclick="goTo('find-teammates')">Find Teammates</button>
                <!-- Hands off to Find Teammates, which owns the one Auto-Match
                     implementation, rather than duplicating the panel here. -->
                <button class="t-open-btn" style="width:180px;background:#1a2a4a"
                        onclick="goTo('find-teammates', '&automatch=1')">Auto-Match Me</button>
            </div>
        </div>
    </div>
    <div class="t-vert-divider"></div>
    <aside class="t-progress-aside">
        <h2 class="t-progress-heading">Team Formation Progress</h2>
        <div class="t-progress-rows" id="progress-rows"></div>
        <button class="t-view-progress-btn" id="continue-btn" onclick="continueSetup()">Continue Setup</button>
    </aside>
</div>
<!-- Request details popup -->
<div class="t-modal-overlay" id="details-modal">
    <div class="t-modal-box s-details-box">
        <button class="s-details-close" onclick="closeDetails()">✕</button>
        <div id="details-body"></div>
    </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/student-nav.js"></script>
<script>
    let unitId, progress, myStudentId, myTeamId, myRequests = [];

    const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    // ── Competing acceptances ────────────────────────────────────────
    // Only one open request can ever take effect: the first that everyone
    // accepts joins the teams and withdraws the rest. A "commitment" is any open
    // request I have already accepted — which includes ones I *sent*, since
    // sending counts as the sender's acceptance.
    function outstandingCommitments(excludeRequestId) {
        return myRequests.filter(p =>
            p.state === 'open' && p.my_response === 'accept' && p.request_id !== excludeRequestId);
    }

    // The side of a request that isn't mine. A team that joined another has a
    // NULL name (LEFT JOIN on a deleted row), hence the fallbacks.
    function otherTeamName(p) {
        const other = p.source_team_id === myTeamId ? p.target_team_name : p.source_team_name;
        return other || p.target_team_name || p.source_team_name || 'another team';
    }

    // A request I sent must not be described as one I "accepted".
    function commitmentLabel(p) {
        const other = otherTeamName(p);
        return p.initiator_id === myStudentId
            ? `your request to ${other}`
            : `${other}'s request`;
    }

    // You are "committed" if you sent the request (sending counts as your
    // acceptance) or you accepted it. Either way there is nothing left to accept
    // — only to call it off. Check initiator first: a sender always has
    // my_response === 'accept' too.
    function commitmentView(initiatorId, myResponse) {
        const sent = initiatorId === myStudentId;
        return {
            committed: sent || myResponse === 'accept',
            actionLabel: sent ? 'Cancel request' : 'Withdraw',
            statusLabel: sent ? 'You sent this request' : 'You accepted'
        };
    }

    // Both sides of a withdrawn request see it, but only one of them actually
    // joined another team — so the reason has to be phrased per viewer. The
    // backend records who moved at the time; rows from before that shipped have
    // nobody recorded and fall back to a neutral statement.
    function cancelledReason(p) {
        const movers = p.cancelled_by || [];
        if (!movers.length) return 'another team-up completed first';
        if (movers.some(m => m.student_id === myStudentId)) return 'you joined another team';
        const names = movers.map(m => m.name || m.student_id);
        const who = names.length === 1 ? names[0]
                  : names.length === 2 ? `${names[0]} and ${names[1]}`
                  : `${names[0]} and ${names.length - 1} others`;
        return `${who} joined another team`;
    }

    function commitmentList(commitments) {
        const labels = commitments.map(commitmentLabel);
        if (labels.length <= 2) return labels.join(' and ');
        return `${labels.slice(0, 2).join(', ')} and ${labels.length - 2} other${labels.length - 2 > 1 ? 's' : ''}`;
    }

    // Two stages you do yourself, two the system derives: grouped (or declared)
    // from your team, finalised from your coordinator's allocation.
    const STAGES = [
        { key:'read_rules',          label:'Read rules' },
        { key:'entered_preferences', label:'Enter preferences' },
        { key:'grouped',             label:'Team up (or declare no preference)' },
        { key:'finalised',           label:'Finalised by coordinator' },
    ];

    (async () => {
        const nav = await initStudentNav({ activeItem:'dashboard', pageTitle:'Student Dashboard' });
        if (!nav) return;
        unitId = nav.unitId;
        myStudentId = nav.user.username;

        const [unit, prog, teamData] = await Promise.all([
            requireUnitAccess(unitId),
            get(`/api/student/units/${unitId}/progress`),
            get(`/api/student/units/${unitId}/my-team`).catch(() => ({ team: null }))
        ]);
        progress = prog;
        myTeamId = teamData.team?.team_id;

        // After my-team: the rows need myTeamId to name the other side of a request.
        await loadRequests();

        // Once the deadline passes the team-up buttons all 403; say so up front
        // rather than letting students discover it by being refused.
        // Guarded: the banner is advisory, and the server enforces the lock
        // regardless — it must never be able to take down the whole dashboard.
        try {
            if (isUnitLocked(unit)) {
                document.querySelector('.t-dash-content')
                    .insertAdjacentHTML('afterbegin', lockedBannerHtml());
            }
        } catch (e) { console.error('Lock banner failed:', e); }

        // Deadline banner
        if (unit.deadline) {
            const d = new Date(unit.deadline);
            document.getElementById('deadline-date').textContent =
                d.toLocaleString('en-AU', { weekday:'long', day:'numeric', month:'long',
                                            year:'numeric', hour:'numeric', minute:'2-digit' });
            const diff = Math.ceil((d - Date.now()) / (1000*60*60*24));
            document.getElementById('deadline-remaining').textContent =
                diff > 0 ? `${diff} day${diff>1?'s':''} remaining` : 'Past deadline';
        }

        // Team status
        if (teamData.team) {
            const n = teamData.members.length;
            document.getElementById('team-status-text').textContent =
                teamData.team.status === 'FINALISED' ? `Finalised — group of ${n}` :
                    teamData.placement === 'DECLARED' ? 'Asked to be placed anywhere' :
                    n >= 2 ? `Group of ${n} — recorded` :
                    'On your own — team up or declare no preference';
        } else {
            document.getElementById('team-status-text').textContent = 'No team yet.';
        }

        // Progress rows
        const rows = document.getElementById('progress-rows');
        rows.innerHTML = STAGES.map(s => {
            const done = prog[s.key] === 1;
            const locked = s.key === 'finalised' && !prog.grouped;
            let dotClass = locked ? 's-dot-gray' : (done ? 't-dot-green' : 't-dot-red');
            let statusText = locked ? 'Locked' : (done ? 'Completed' : (s.key==='read_rules' ? 'Not started' : 'In progress'));
            let statusClass = locked ? 'locked' : (done ? 'completed' : (s.key==='read_rules'&&!done ? 'not-started':'in-progress'));
            return `<div class="t-progress-row">
        <div class="t-dot ${dotClass}"></div>
        <span class="t-progress-label">${s.label}</span>
        <span class="s-progress-status ${statusClass}">${statusText}</span>
      </div>`;
        }).join('');
    })();

    function continueSetup() {
        if (!progress) return;
        if (!progress.read_rules)          { goTo('rules'); return; }
        if (!progress.entered_preferences) { goTo('preferences'); return; }
        if (!progress.grouped)             { goTo('find-teammates'); return; }
        goTo('my-team');
    }

    function goTo(page, extra = '') {
        window.location = `/student/${page}.html?unitId=${unitId}${extra}`;
    }

    // Only shown at 2+ commitments — at 0 or 1 there is no race to warn about.
    function renderRaceWarning() {
        const el = document.getElementById('race-warning');
        const commitments = outstandingCommitments();
        if (commitments.length < 2) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.innerHTML = `⚠ You've committed to ${commitments.length} requests
            (${escapeHtml(commitmentList(commitments))}). Whichever team finishes accepting first is the
            one you'll join — the rest will be withdrawn.`;
    }

    async function loadRequests() {
        try {
            const proposals = await get(`/api/student/units/${unitId}/team-requests`);
            myRequests = proposals;
            const card = document.getElementById('invites-card');
            const list = document.getElementById('invites-list');

            const open = proposals.filter(p => p.state === 'open');
            if (!proposals.length) { card.style.display = 'none'; return; }

            card.style.display = 'block';
            document.getElementById('invite-count-badge').textContent = open.length || proposals.length;
            renderRaceWarning();

            list.innerHTML = proposals.map(p => {
                const isOpen = p.state === 'open';
                const stateLabel = isOpen
                    ? `${p.tally.accepted}/${p.tally.accepted + p.tally.declined + p.tally.pending} accepted`
                    : p.state === 'auto_cancelled'
                        ? `withdrawn — ${cancelledReason(p)}`
                        : p.state === 'expired'
                            ? 'expired — nobody responded in time'
                            : p.state === 'approved' ? 'accepted — you are one group'
                            : p.state === 'rejected' ? 'declined'
                            : p.state === 'invalidated'
                                ? `no longer valid${p.invalidated_reason ? ' — ' + p.invalidated_reason : ''}`
                                : p.state.replace('_', ' ');
                const otherName = p.source_team_name && p.target_team_name
                    ? `${p.source_team_name} ↔ ${p.target_team_name}`
                    : 'team-up request';
                // An open proposal lapses at expires_at unless everyone accepts,
                // so surface the deadline, not just the tally.
                let deadline = '';
                if (isOpen && p.expires_at) {
                    const hrs = Math.round((Date.parse(p.expires_at) - Date.now()) / 3600000);
                    deadline = hrs <= 0
                        ? ' · expiring shortly'
                        : p.my_response === 'pending'
                            ? ` · auto-declines in ${hrs}h`
                            : ` · expires in ${hrs}h`;
                }
                // Once committed there is nothing to accept — only to call off.
                const { committed, actionLabel, statusLabel } =
                    commitmentView(p.initiator_id, p.my_response);
                const status = isOpen && committed
                    ? statusLabel
                    : `Your response: ${p.my_response === 'accept' ? 'accepted' : p.my_response === 'decline' ? 'declined' : 'none'}`;
                return `
                  <div class="invite-row" id="invite-row-${p.request_id}">
                    <div class="invite-info">
                      <strong>${escapeHtml(otherName)}</strong>
                      <br><span>${escapeHtml(status)} · ${escapeHtml(stateLabel)}${escapeHtml(deadline)}</span>
                    </div>
                    <div class="invite-actions">
                      <button class="btn-details" onclick="openDetails('${p.request_id}')">Details</button>
                      ${!isOpen ? `
                        <button class="btn-decline" onclick="dismissRequest('${p.request_id}')">Dismiss</button>
                      ` : committed ? `
                        <button class="btn-decline" onclick="respond('${p.request_id}','decline')">${actionLabel}</button>
                      ` : `
                        <button class="btn-accept"  onclick="respond('${p.request_id}','accept')">Accept</button>
                        <button class="btn-decline" onclick="respond('${p.request_id}','decline')">Decline</button>
                      `}
                    </div>
                  </div>
                `;
            }).join('');
        } catch(e) {
            console.error('Could not load team-up requests:', e);
        }
    }

    async function respond(requestId, response) {
        // Accepting a second request is a real decision: both acceptances are
        // binding and the winner is decided by other people's timing. Declining
        // is never ambiguous, so it is never gated.
        if (response === 'accept') {
            const others = outstandingCommitments(requestId);
            if (others.length && !confirm(
                    `You've already committed to ${commitmentList(others)}.\n\n` +
                    `Accepting this one as well means whichever team finishes accepting first is the ` +
                    `one you'll join — the other will be withdrawn.\n\nAccept anyway?`)) {
                return;
            }
        }
        try {
            const result = await api('PATCH',
                `/api/student/units/${unitId}/team-requests/${requestId}/respond`, { response });
            if (result.resolved && result.state === 'approved') {
                window.location.reload();
            } else {
                if (result.state === 'invalidated' && result.reason)
                    alert(`This request can no longer go ahead: ${result.reason}`);
                await loadRequests();
            }
        } catch(e) {
            alert('Could not respond: ' + e.message);
        }
    }

    async function dismissRequest(requestId) {
        try {
            await api('PATCH', `/api/student/units/${unitId}/team-requests/${requestId}/seen`);
            await loadRequests();
        } catch(e) { console.error(e); }
    }

    // ── Request details popup ────────────────────────────────────────
    // Everything below reads from two existing endpoints: the request detail
    // (names + each member's response) and the per-team view (roster + max size).
    async function openDetails(requestId) {
        const body = document.getElementById('details-body');
        body.innerHTML = `<p style="color:#888">Loading…</p>`;
        document.getElementById('details-modal').classList.add('open');

        try {
            const detail = await get(`/api/student/units/${unitId}/team-requests/${requestId}`);
            // Once accepted, the joining team's row is deleted, so one of these can 404.
            const [srcView, tgtView] = await Promise.all([
                get(`/api/student/units/${unitId}/teams/${detail.request.source_team_id}`).catch(() => null),
                get(`/api/student/units/${unitId}/teams/${detail.request.target_team_id}`).catch(() => null)
            ]);
            // Identify my side by roster membership, not team id — stays correct
            // after a team-up has moved my membership to the surviving team.
            const mineIsSource = (srcView?.members || []).some(m => m.student_id === myStudentId);
            const myView    = mineIsSource ? srcView : tgtView;
            const otherView = mineIsSource ? tgtView : srcView;
            body.innerHTML = renderDetails(detail, myView, otherView);
        } catch(e) {
            body.innerHTML = `
              <div class="s-details-title">Request details</div>
              <p class="s-details-sub">Could not load this request: ${escapeHtml(e.message)}</p>
              <div class="t-modal-actions">
                <button class="t-modal-cancel" onclick="closeDetails()">Close</button>
              </div>`;
        }
    }

    function voteChip(member, detail, voteBy) {
        if (member.student_id === detail.request.initiator_id)
            return `<span class="s-vote-chip initiator">sent request</span>`;
        const v = voteBy.get(member.student_id);
        if (!v)                       return `<span class="s-vote-chip">—</span>`;
        if (v.response === 'accept')  return `<span class="s-vote-chip yes">✓ accepted</span>`;
        if (v.response === 'decline') return `<span class="s-vote-chip no">✕ declined</span>`;
        return member.student_id === myStudentId
            ? `<span class="s-vote-chip">awaiting your response</span>`
            : `<span class="s-vote-chip">awaiting</span>`;
    }

    function teamSection(title, view, detail, voteBy) {
        const rows = !view
            ? `<div class="s-detail-note">This team no longer exists (it joined another).</div>`
            : (view.members || []).map(m => `
                <div class="s-detail-member">
                  <span class="s-detail-name">${escapeHtml(m.name || m.student_id)}
                    ${m.role ? `<span class="s-detail-role">· ${escapeHtml(m.role)}</span>` : ''}</span>
                  ${voteChip(m, detail, voteBy)}
                  ${m.student_id === myStudentId ? '' : `
                    <a class="s-profile-link" target="_blank" rel="noopener"
                       href="/student/classmate-profile.html?unitId=${encodeURIComponent(unitId)}&studentId=${encodeURIComponent(m.student_id)}">View profile</a>`}
                </div>`).join('') || `<div class="s-detail-note">No members.</div>`;
        const heading = view?.team
            ? `${title} (${escapeHtml(view.team.team_name || 'Team ' + view.team.team_number)})`
            : title;
        return `<div class="s-detail-section">
                  <div class="s-detail-section-title">${heading}</div>
                  ${rows}
                </div>`;
    }

    function renderDetails(detail, myView, otherView) {
        const p = detail.request;
        const voteBy = new Map((detail.responses || []).map(v => [v.student_id, v]));
        const senderName = voteBy.get(p.initiator_id)?.name || p.initiator_id;
        // Named *Label to avoid shadowing the otherTeamName(p) helper above.
        const otherTeamLabel = otherView?.team?.team_name || 'Their team';
        const myTeamLabel    = myView?.team?.team_name    || 'your team';

        const combined = (myView?.members?.length || 0) + (otherView?.members?.length || 0);
        const maxSize  = myView?.maxSize ?? otherView?.maxSize ?? null;
        const overMax  = maxSize !== null && combined > maxSize;

        const isOpen = p.state === 'open';
        // Only unanimous acceptance joins the teams: at expires_at the request
        // lapses, so silence declines it. Say which way the deadline cuts.
        const myVote = (detail.responses || []).find(v => v.student_id === myStudentId)?.response;
        let timing = '';
        if (isOpen && p.expires_at) {
            const hrs = Math.round((Date.parse(p.expires_at) - Date.now()) / 3600000);
            timing = hrs <= 0
                ? ' · deadline passed — expiring shortly'
                : myVote === 'pending'
                    ? ` · auto-declines in ${hrs}h unless you accept`
                    : ` · expires in ${hrs}h unless everyone accepts`;
        } else if (!isOpen) {
            const when = p.resolved_at ? new Date(p.resolved_at).toLocaleString('en-AU') : '';
            const label = p.state === 'auto_cancelled'
                ? `withdrawn — ${cancelledReason(p)}`
                : p.state === 'expired'
                    ? 'expired because not everyone responded in time'
                    : p.state === 'approved' ? 'accepted by everyone'
                    : p.state === 'rejected' ? 'declined'
                    : p.state === 'invalidated'
                        ? `no longer valid${p.invalidated_reason ? ' — ' + p.invalidated_reason : ''}`
                        : p.state.replace('_', ' ');
            timing = ` · ${label}${when ? ' ' + when : ''}`;
        }
        const sizeText = maxSize !== null ? `Combined size: ${combined} / ${maxSize}` : `Combined size: ${combined}`;

        // Same rule as the card row, so the two can never contradict each other.
        const commitment = commitmentView(p.initiator_id, myVote);

        // Competing acceptances: only one of them can ever take effect.
        const others = isOpen ? outstandingCommitments(p.request_id) : [];
        const raceWarning = !others.length ? '' : `
          <div class="s-details-warning">
            ${myVote === 'accept'
              ? `⚠ You've also committed to ${escapeHtml(commitmentList(others))}. Whichever team
                 finishes accepting first is the one you'll join — the other will be withdrawn.`
              : `⚠ You've already committed to ${escapeHtml(commitmentList(others))}. Accepting this one
                 too means whichever team finishes accepting first is the one you'll join.`}
          </div>`;

        return `
          <div class="s-details-title">Request from ${escapeHtml(senderName)}</div>
          <div class="s-details-sub">${escapeHtml(otherTeamLabel)} wants to team up with your ${escapeHtml(myTeamLabel)}.</div>
          <div class="s-details-meta${overMax ? ' warn' : ''}">
            ${escapeHtml(sizeText)}${overMax ? ' — over the maximum team size' : ''}${escapeHtml(timing)}
          </div>
          ${raceWarning}
          ${teamSection('Their team', otherView, detail, voteBy)}
          ${teamSection('Your team', myView, detail, voteBy)}
          <div class="t-modal-actions">
            ${!isOpen ? `
              <button class="btn-decline" onclick="dismissFromDetails('${p.request_id}')">Dismiss</button>
            ` : commitment.committed ? `
              <button class="btn-decline" onclick="respondFromDetails('${p.request_id}','decline')">${commitment.actionLabel}</button>
            ` : `
              <button class="btn-accept"  onclick="respondFromDetails('${p.request_id}','accept')">Accept</button>
              <button class="btn-decline" onclick="respondFromDetails('${p.request_id}','decline')">Decline</button>
            `}
            <button class="t-modal-cancel" onclick="closeDetails()">Close</button>
          </div>`;
    }

    async function respondFromDetails(requestId, response) {
        closeDetails();
        await respond(requestId, response);
    }

    async function dismissFromDetails(requestId) {
        closeDetails();
        await dismissRequest(requestId);
    }

    function closeDetails() {
        document.getElementById('details-modal').classList.remove('open');
    }

    document.getElementById('details-modal').addEventListener('click', e => {
        if (e.target.id === 'details-modal') closeDetails();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDetails();
    });
</script>
</body>
</html>

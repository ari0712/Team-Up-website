<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team – TeamUp</title>
    <link rel="stylesheet" href="/assets/css/style1.css">
    <link rel="stylesheet" href="/assets/css/teacher-style.css">
    <style>
        .s-card { background:#fff;border-radius:14px;padding:22px 24px;border:1.5px solid #d0dff0;margin-bottom:16px }
        .s-member-row { display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px }
        .s-member-row:last-child { border-bottom:none }
        .s-member-status { font-weight:700 }
        .s-member-status.accepted { color:#22c55e }
        .s-member-status.waiting  { color:#e94560 }
        .s-validation { background:#7ec8e3;border-radius:12px;padding:18px 20px;margin-bottom:16px }
        .s-validation h4 { font-size:14px;font-weight:700;color:#fff;margin-bottom:12px }
        .s-val-row { display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:#fff }
        .s-val-dot { width:11px;height:11px;border-radius:50%;flex-shrink:0 }
        .s-fix-text { font-size:13px;color:#555;font-weight:600;margin-bottom:6px }
        .s-member-link { color:#1a2a4a;text-decoration:none;border-bottom:1px dotted #9bb8d4 }
        .s-member-link:hover { color:#2663ff;border-bottom-color:#2663ff }
        .s-member-slots { flex:1.6;min-width:0;color:#555;font-size:12px }
        .s-member-slots.unset { color:#e94560;font-weight:600 }
        .s-tut-fix { background:#fff8e6;border:1.5px solid #f0d9a0;border-radius:12px;padding:14px 18px;margin-bottom:16px }
        .s-tut-opt { font-size:13px;color:#444;padding:6px 0;border-bottom:1px solid #f2e6c8 }
        .s-tut-opt:last-of-type { border-bottom:none }
        .s-action-row { display:flex;gap:12px;margin-top:8px;flex-wrap:wrap }
    </style>
</head>
<body class="t-page">
<header class="t-header">
    <button class="t-logout-btn" onclick="studentLogout()">Log Out</button>
    <div class="t-header-title">
        <h1 id="page-title">My Team</h1>
        <p>Welcome, <span id="welcome-name"></span>!</p>
    </div>
    <a class="logo" href="#"><img class="logo-icon" src="/assets/img/teamup-icon.png" alt="TeamUp">
        <span class="logo-text"><span class="team">Team</span><span class="up">Up</span></span></a>
</header>
<div class="t-divider"></div>
<div class="t-dashboard-layout">
    <nav class="t-sidebar-nav" id="student-sidebar"></nav>
    <div style="flex:1;padding:28px 32px;overflow-y:auto;max-width:760px">
        <div id="team-content"><p style="color:#888">Loading…</p></div>
    </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/student-nav.js"></script>
<script>
    let unitId, teamData, unitData, myStudentId;

    (async () => {
        const nav = await initStudentNav({ activeItem:'my-team', pageTitle:'My Team' });
        if (!nav) return;
        unitId = nav.unitId;
        myStudentId = nav.user.username;
        await loadTeam();
    })();

    let locked = false;

    async function loadTeam() {
        // Submit / Leave are refused after the deadline, so reflect that in the
        // buttons instead of surfacing a 403 on click.
        const [team, unit] = await Promise.all([
            get(`/api/student/units/${unitId}/my-team`),
            get(`/api/student/units/${unitId}`).catch(() => null),
        ]);
        teamData = team;
        // Kept for `valid_team_sizes` — that column lives on `units`, not on the
        // team row, so the team payload cannot answer "is this team full?".
        unitData = unit;
        // Advisory only — the server refuses the actions either way, so a
        // problem here must not stop the team rendering.
        try { locked = isUnitLocked(unit); } catch { locked = false; }
        render();
    }

    // Slot labels are teacher-authored free text, so they are escaped on the way out.
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    // A member's availability: their saved preference wins, the teacher's roster
    // import is the fallback. Mirrors slotsOf() in services/matchingService.js.
    function slotsOf(m) {
        const parse = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
        const own = parse(m.tutorial_slots);
        return own.length ? own : parse(m.tutorial_time);
    }

    // "No shared tutorial slot" on its own is a dead end, so work out which slots
    // are closest to working and who would have to move for each. Same shape as
    // _whyUnassigned() in services/matchingService.js, but per-team.
    function tutorialAdvice(members) {
        const rows = members.filter(m => m.status === 'ACCEPTED')
            .map(m => ({ m, slots: slotsOf(m) }));
        const nameOf = m => m.student_id === myStudentId ? 'you' : (m.name || m.student_id);

        const unset = rows.filter(r => !r.slots.length).map(r => nameOf(r.m));

        // Only slots somebody already holds are worth suggesting — one nobody
        // holds would need more people to move, never fewer. Members with nothing
        // saved count as movers everywhere, which is right: they must pick something.
        const labels = [...new Set(rows.flatMap(r => r.slots))];
        const options = labels
            .map(label => ({
                label,
                movers: rows.filter(r => !r.slots.includes(label)).map(r => nameOf(r.m)),
            }))
            .sort((a, b) => a.movers.length - b.movers.length || a.label.localeCompare(b.label))
            .slice(0, 3);

        return { unset, options };
    }

    function tutorialAdviceHtml(members) {
        const { unset, options } = tutorialAdvice(members);
        const list = names => names.map(esc).join(', ');
        // With no options the headline already says nobody has availability saved,
        // so naming everyone again would just repeat it.
        const unsetLine = !unset.length || !options.length ? '' : unset.length === 1 && unset[0] === 'you'
            ? `<p class="s-fix-text">You haven't set your tutorial availability yet.</p>`
            : `<p class="s-fix-text">${list(unset)} ${unset.length > 1 ? "haven't" : "hasn't"} set their tutorial availability yet.</p>`;

        return `
      <div class="s-tut-fix">
        <p class="s-fix-text">${options.length
            ? 'No tutorial slot works for everyone. Closest options:'
            : 'Nobody in this team has set their tutorial availability yet.'}</p>
        ${options.map(o => `
          <div class="s-tut-opt"><strong>${esc(o.label)}</strong> — ${list(o.movers)} must add this slot</div>`).join('')}
        ${unsetLine}
        <button class="t-open-btn" style="width:220px;margin-top:10px"
            onclick="window.location='/student/preferences.html?unitId=${unitId}'">Update my availability</button>
      </div>`;
    }

    // Colours for the validation rows. Neutral is for advisory facts (an
    // under-target size) — a fact, not a fault, so never red.
    const GREEN = '#22c55e', RED = '#e94560', NEUTRAL = '#2663ff';

    function render() {
        const el = document.getElementById('team-content');
        if (!teamData.team) {
            el.innerHTML = `
        <div class="s-card">
          <h3 style="font-size:19px;font-weight:800;margin-bottom:8px">My Team</h3>
          <p style="color:#888;margin-bottom:16px">You are not in a team yet.</p>
          <button class="t-open-btn" style="width:200px" onclick="window.location='/student/find-teammates.html?unitId=${unitId}'">Find Teammates</button>
        </div>`;
            return;
        }
        const { team, members, validation: v, noPreferenceAt } = teamData;
        const finalised = team.status === 'FINALISED';
        const targetLabel = teamData.targetSizeLabel || String(unitData?.valid_team_sizes || '4');
        const violations = v.violations || [];
        const has = code => violations.some(x => x.code === code);
        const maxTeamSize = Math.max(...(v.targetSizes || [4]));
        // Recruiting is pointless once the team is complete and at its largest
        // allowed size; a complete 4-of-"4,5" team can still take a fifth member.
        const findDisabled  = v.sizeState === 'COMPLETE' && !violations.length && members.length >= maxTeamSize;
        const leaveDisabled = members.length <= 1;
        const canEdit = !finalised && !locked;

        // ── Size row: advisory unless over the maximum ──
        const sizeDot  = v.sizeState === 'COMPLETE' ? GREEN : v.sizeState === 'OVER_MAX' ? RED : NEUTRAL;
        const sizeText = v.sizeState === 'COMPLETE'
            ? `Team has ${members.length} student${members.length !== 1 ? 's' : ''} — complete`
            : v.sizeState === 'OVER_MAX'
            ? `Team has ${members.length} students — over the maximum of ${maxTeamSize}`
            : `Group of ${members.length} — target size ${esc(targetLabel)}`;

        // ── Rule rows: red only when the rule is actually broken ──
        const tutorialText = !v.tutorialRequired
            ? 'A shared tutorial slot is not required in this unit'
            : v.tutorialShared ? `Members share ${esc(v.sharedTutorials[0])}`
            : has('NO_SHARED_TUTORIAL') ? 'No shared tutorial slot — see below'
            : 'No tutorial availability yet';
        const tutorialDot = !v.tutorialRequired ? NEUTRAL : has('NO_SHARED_TUTORIAL') ? RED : v.tutorialShared ? GREEN : NEUTRAL;
        const newDot = has('NEW_TO_QUT_CAP') ? RED : GREEN;

        // ── Status banners ──
        // Finalised: the coordinator has allocated this team; nothing changes now.
        const finalisedBanner = finalised ? `
        <div class="s-card" style="border-color:#bfe3c8;background:#eefaf1">
          <p style="font-size:14px;font-weight:800;color:#1f7a3a;margin-bottom:4px">Finalised by your coordinator</p>
          <p style="font-size:13px;color:#2f5a3c;margin:0">This is your final team. Membership and the preferences it was built from can no longer change.</p>
        </div>` : '';
        // In breach: the group was fine when it formed, but a rule changed under
        // it. The student must hear it here, with the rule named, never by
        // being dissolved.
        const breachBanner = !v.solo && violations.length ? `
        <div class="s-card" style="border-color:#f0d9a0;background:#fff8e6">
          <p style="font-size:14px;font-weight:800;color:#8a6100;margin-bottom:6px">This group no longer meets a unit rule</p>
          ${violations.map(x => `<p style="font-size:13px;color:#6b5a2e;margin:0 0 4px 0"><strong>${esc(x.rule)}</strong> — ${esc(x.why)}</p>`).join('')}
          <p style="font-size:13px;color:#6b5a2e;margin:8px 0 0 0">Your coordinator changed a rule and this group no longer meets it.
             ${canEdit ? 'Fix it (a tutorial slot, say), leave the group, or contact your coordinator.' : 'Contact your coordinator — they can see this too.'}</p>
        </div>` : '';
        // Recorded: an accepted team-up request is the record. Nothing to submit.
        const recordedNote = !finalised && !v.solo && !violations.length ? `
        <div class="s-card" style="border-color:#d0dff0;background:#f5f9ff">
          <p style="font-size:14px;font-weight:800;color:#1a2a4a;margin-bottom:4px">Your group is recorded</p>
          <p style="font-size:13px;color:#555;margin:0">Nothing else to do.${v.sizeState === 'UNDER_TARGET'
              ? ` You can still team up with more people until the deadline; your coordinator finalises teams after it.`
              : ` Your coordinator finalises teams after the deadline.`}</p>
        </div>` : '';
        const soloBlock = !finalised && v.solo ? soloHtml(noPreferenceAt) : '';

        el.innerHTML = `
      ${locked && !finalised ? lockedBannerHtml('Your coordinator will finalise teams from here.') : ''}
      ${finalisedBanner}
      ${breachBanner}
      <div class="s-card">
        <h3 style="font-size:19px;font-weight:800;margin-bottom:4px">My Team</h3>
        <p style="font-size:13px;color:#666;margin-bottom:16px">Team Name: <strong>${team.team_name}</strong></p>
        <div style="background:#7ec8e3;border-radius:8px;padding:8px 16px;margin-bottom:16px;font-size:13px;font-weight:700;color:#fff;display:inline-block">Team Members</div>
        <div id="members-list">
          ${members.map((m,i) => {
              const slots = slotsOf(m);
              return `
            <div class="s-member-row">
              <span style="min-width:20px;color:#888">${i+1}.</span>
              <!-- Teammates' write-ups are worth reading once you're committed to
                   each other, so the name links straight to the full profile. -->
              <span style="flex:1;font-weight:600"><a class="s-member-link"
                 href="/student/full-profile.html?unitId=${unitId}&studentId=${encodeURIComponent(m.student_id)}&from=my-team"
                 >${esc(m.name || m.student_id)}</a></span>
              <span style="flex:1;color:#555">${m.role || '—'}</span>
              <span class="s-member-slots${slots.length ? '' : ' unset'}">${
                  slots.length ? esc(slots.join(', ')) : 'Availability not set'}</span>
            </div>`;}).join('')}
        </div>
      </div>
      <div class="s-validation">
        <h4>Team Validation :</h4>
        <div class="s-val-row"><div class="s-val-dot" style="background:${sizeDot}"></div> ${sizeText}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${tutorialDot}"></div> ${tutorialText}</div>
        <div class="s-val-row"><div class="s-val-dot" style="background:${newDot}"></div> New-to-QUT students: ${v.newToQutCount} / ${v.maxNewToQut}</div>
      </div>
      ${recordedNote}
      ${canEdit && has('NO_SHARED_TUTORIAL') ? tutorialAdviceHtml(members) : ''}
      ${soloBlock}
      <div class="s-action-row">
        ${canEdit ? `<button class="t-open-btn" style="width:200px;${findDisabled?'background:#aaa;cursor:not-allowed':''}"
            ${findDisabled?'disabled title="Your team is complete and full."':''}
            onclick="window.location='/student/find-teammates.html?unitId=${unitId}'">Find More Teammates</button>` : ''}
        ${canEdit ? `<button class="t-open-btn" style="width:180px;background:${leaveDisabled?'#aaa':'#e94560'};${leaveDisabled?'cursor:not-allowed':''}"
            ${leaveDisabled?'disabled title="You are the only member of this team."':''}
            onclick="leaveTeam()">Leave Team</button>` : ''}
      </div>`;
    }

    // A solo student has no group to record. This is their alternative: an
    // explicit, timestamped declaration the coordinator can act on.
    function soloHtml(noPreferenceAt) {
        if (noPreferenceAt) {
            const when = new Date(noPreferenceAt).toLocaleString('en-AU',
                { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });
            return `
        <div class="s-card" style="border-color:#bfe3c8;background:#eefaf1">
          <p style="font-size:14px;font-weight:800;color:#1f7a3a;margin-bottom:4px">You&#39;ve asked to be placed anywhere</p>
          <p style="font-size:13px;color:#2f5a3c;margin:0 0 10px 0">Recorded on ${when}. Your coordinator will place you in a team after the deadline.
             You can still join a group before then — doing so withdraws this automatically.</p>
          <button class="t-open-btn" style="width:160px;background:#888" onclick="withdrawNoPreference()">Withdraw</button>
        </div>`;
        }
        return `
        <div class="s-card" style="border-color:#d0dff0">
          <p style="font-size:14px;font-weight:800;color:#1a2a4a;margin-bottom:4px">No preferred teammates?</p>
          <p style="font-size:13px;color:#555;margin:0 0 10px 0">A group is recorded the moment someone accepts your team-up request. If you don&#39;t mind who you work with,
             tell your coordinator so — you won&#39;t be chased, and they&#39;ll place you after the deadline.</p>
          <button class="t-open-btn" style="width:200px" onclick="declareNoPreference()">Place me anywhere</button>
        </div>`;
    }

    async function declareNoPreference() {
        try { await post(`/api/student/units/${unitId}/no-preference`, {}); await loadTeam(); }
        catch(e) { alert(e.message); }
    }

    async function withdrawNoPreference() {
        try { await del(`/api/student/units/${unitId}/no-preference`); await loadTeam(); }
        catch(e) { alert(e.message); }
    }

    async function leaveTeam() {
        if (!confirm('Are you sure you want to leave this team?')) return;
        try {
            await fetch(`/api/student/units/${unitId}/teams/${teamData.team.team_id}/leave`, { method: 'DELETE' });
            window.location = `/student/dashboard.html?unitId=${unitId}`;
        } catch(e) { alert(e.message); }
    }
</script>
</body>
</html>

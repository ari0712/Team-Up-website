<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Create Unit</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Home</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text">
      <span class="team">Team</span><span class="up">Up</span>
    </span>
    </a>
</header>

<main class="t-main">
    <div class="t-create-card">
        <h2 class="t-create-title">Create Unit Instance</h2>

        <div class="t-field-row">
            <label class="t-label">Unit Name:</label>
            <input class="t-input" id="unitName" type="text" placeholder="e.g. IFB398">
        </div>
        <div class="t-field-row">
            <label class="t-label">Description:</label>
            <input class="t-input t-input-wide" id="description" type="text" placeholder="e.g. IT Capstone Project">
        </div>
        <div class="t-field-row">
            <label class="t-label">Semester:</label>
            <input class="t-input" id="semester" type="text" placeholder="e.g. 2026 Semester 1">
        </div>
        <div class="t-field-row">
            <label class="t-label">Deadline:</label>
            <input class="t-input t-input-wide" id="deadline" type="datetime-local">
        </div>

        <h3 class="t-section-title">Rule Set</h3>
        <div class="t-ruleset">
            <div class="t-rule-box t-size-box">
                <p class="t-rule-label">Team Size:</p>
                <div class="t-num-grid" id="teamSizeGrid"></div>
            </div>
            <div class="t-rule-right">
                <div class="t-rule-box t-toggle-box" onclick="toggleRule('maxOneGroup')">
                    <span>Max One Group Per Student:</span>
                    <span class="t-tick" id="tick-maxOneGroup">✓</span>
                </div>
                <div class="t-rule-box t-toggle-box" onclick="toggleRule('mustShare')">
                    <span>Students Must Share Tutorial Time:</span>
                    <span class="t-tick" id="tick-mustShare">✓</span>
                </div>
            </div>
            <div class="t-rule-box t-qut-box">
                <p class="t-rule-label">Maximum new-to-QUT Students Per Group:</p>
                <div class="t-num-grid" id="newQutGrid"></div>
            </div>
        </div>

        <div class="t-bottom-row">
            <div class="t-csv-row">
                <label class="t-label">Student List CSV:</label>
                <button class="t-csv-btn" onclick="document.getElementById('csvFile').click()">
                    ADD FILE (.CSV)
                </button>
                <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="onCsvSelected(this)">
                <span class="t-csv-name" id="csvName"></span>
                <span class="t-csv-count" id="csvCount"></span>
            </div>
            <button class="t-create-btn" onclick="doCreate()">Create</button>
        </div>
        <div class="t-error" id="errorMsg"></div>
    </div>
</main>

<script src="api.js"></script>
<script>
    const FIXED_COLS = ['student_id','name','tutorial_time','is_new_to_qut',
        'degree','major','minor','units_passed'];
    const state = {
        teamSizes: new Set([4, 5]),
        maxOneGroup: true,
        mustShare: true,
        maxNewToQut: 2,
        students: []
    };

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        buildGrids();
    })();

    function buildGrids() {
        buildNumGrid('teamSizeGrid', 1, 6, 'size', n => state.teamSizes.has(n));
        buildNumGrid('newQutGrid',   1, 6, 'qut',  n => n === state.maxNewToQut);
    }

    function buildNumGrid(id, min, max, type, isSel) {
        document.getElementById(id).innerHTML =
            Array.from({length: max - min + 1}, (_,i) => i + min).map(n => {
                const s = isSel(n);
                return `<div class="t-num-cell ${s?'selected':''}"
                   onclick="toggleNum('${type}',${n})">
                ${n}${s?' ✓':''}
              </div>`;
            }).join('');
    }

    function toggleNum(type, val) {
        if (type === 'size') {
            state.teamSizes.has(val) ? state.teamSizes.delete(val) : state.teamSizes.add(val);
        } else {
            state.maxNewToQut = val;
        }
        buildGrids();
    }

    function toggleRule(rule) {
        state[rule] = !state[rule];
        document.getElementById(`tick-${rule}`).style.visibility = state[rule] ? 'visible' : 'hidden';
    }

    function onCsvSelected(input) {
        const file = input.files[0];
        if (!file) return;
        document.getElementById('csvName').textContent = file.name;

        const reader = new FileReader();
        reader.onload = e => {
            const lines = e.target.result.split('\n').filter(l => l.trim());
            if (lines.length < 2) { document.getElementById('csvCount').textContent = '(empty)'; return; }

            // Normalise headers to snake_case
            const headers = lines[0].split(',').map(h =>
                h.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '')
            );
            const itCols = headers.filter(h => !FIXED_COLS.includes(h));

            state.students = [];
            for (let i = 1; i < lines.length; i++) {
                const vals = lines[i].split(',').map(v => v.trim());
                const row  = {};
                headers.forEach((h, idx) => { row[h] = vals[idx] || ''; });
                // IT skill groups: collect column names where student has a non-zero value
                row.it_skill_groups = itCols.filter(c => row[c] && row[c] !== '0').join(',');
                state.students.push(row);
            }

            document.getElementById('csvCount').textContent =
                `${state.students.length} student${state.students.length !== 1 ? 's' : ''} loaded`;
        };
        reader.readAsText(file);
    }

    async function doCreate() {
        const unitName    = document.getElementById('unitName').value.trim();
        const description = document.getElementById('description').value.trim();
        const semester    = document.getElementById('semester').value.trim();
        const deadline    = document.getElementById('deadline').value;
        const errEl       = document.getElementById('errorMsg');
        errEl.textContent = '';

        if (!unitName)          { errEl.textContent = 'Unit name is required.'; return; }
        if (!deadline)          { errEl.textContent = 'Please set a deadline.'; return; }
        if (!state.teamSizes.size) { errEl.textContent = 'Select at least one team size.'; return; }

        try {
            await post('/api/units', {
                unitName, description, semester, deadline,
                validTeamSizes: [...state.teamSizes].sort((a,b)=>a-b).join(','),
                maxOneGroup:       state.maxOneGroup,
                mustShareTutorial: state.mustShare,
                maxNewToQut:       state.maxNewToQut,
                students:          state.students
            });
            window.location = '/teacher-home.html';
        } catch (e) { errEl.textContent = e.message; }
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamUp – Create Unit</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="teacher-style.css">
</head>
<body class="t-page">

<header class="t-header">
    <button class="t-logout-btn" onclick="doLogout()">Log Out</button>
    <div class="t-header-title">
        <h1>Teacher Home</h1>
        <p>Welcome, <span id="teacherName"></span>!</p>
    </div>
    <a class="logo" href="#">
        <img class="logo-icon" src="teamup-icon.png" alt="TeamUp">
        <span class="logo-text">
      <span class="team">Team</span><span class="up">Up</span>
    </span>
    </a>
</header>

<main class="t-main">
    <div class="t-create-card">
        <h2 class="t-create-title">Create Unit Instance</h2>

        <!-- Unit Name -->
        <div class="t-field-row">
            <label class="t-label">Unit Name:</label>
            <input class="t-input" id="unitName" type="text" placeholder="e.g. IFB398">
        </div>

        <!-- Rule Set -->
        <h3 class="t-section-title">Rule Set</h3>

        <div class="t-ruleset">

            <!-- Team Size -->
            <div class="t-rule-box t-size-box">
                <p class="t-rule-label">Team Size:</p>
                <div class="t-num-grid" id="teamSizeGrid">
                    <!-- JS generates 1-6 -->
                </div>
            </div>

            <div class="t-rule-right">
                <!-- Max One Group -->
                <div class="t-rule-box t-toggle-box" id="toggleMaxOneGroup" onclick="toggleRule('maxOneGroup')">
                    <span>Max One Group Per Student:</span>
                    <span class="t-tick" id="tick-maxOneGroup">✓</span>
                </div>
                <!-- Must Share Tutorial -->
                <div class="t-rule-box t-toggle-box" id="toggleMustShare" onclick="toggleRule('mustShare')">
                    <span>Students Must Share Tutorial Time:</span>
                    <span class="t-tick" id="tick-mustShare">✓</span>
                </div>
            </div>

            <!-- Max new-to-QUT -->
            <div class="t-rule-box t-qut-box">
                <p class="t-rule-label">Maximum new-to-QUT Students Per Group:</p>
                <div class="t-num-grid" id="newQutGrid">
                    <!-- JS generates 1-6 -->
                </div>
            </div>

        </div><!-- end t-ruleset -->

        <!-- CSV + Create -->
        <div class="t-bottom-row">
            <div class="t-csv-row">
                <label class="t-label">Student List CSV:</label>
                <button class="t-csv-btn" onclick="document.getElementById('csvFile').click()">
                    ADD FILE (.CSV)
                </button>
                <input type="file" id="csvFile" accept=".csv"
                       style="display:none" onchange="onCsvSelected(this)">
                <span class="t-csv-name" id="csvName"></span>
            </div>
            <button class="t-create-btn" onclick="doCreate()">Create</button>
        </div>
        <div class="t-error" id="errorMsg"></div>

    </div><!-- end t-create-card -->
</main>

<footer class="t-footer">High Fidelity Design Concept.</footer>

<script src="api.js"></script>
<script>
    // State
    const state = {
        teamSizes: new Set([4, 5]),   // default: 4 and 5 are valid sizes
        maxOneGroup: true,
        mustShare: true,
        maxNewToQut: 2,               // single selection
        studentCount: 0
    };

    (async () => {
        const user = await requireSession('TEACHER');
        if (!user) return;
        document.getElementById('teacherName').textContent = user.username;
        buildGrids();
    })();

    function buildGrids() {
        buildNumGrid('teamSizeGrid', 1, 6, 'size', (n) => state.teamSizes.has(n));
        buildNumGrid('newQutGrid',    1, 6, 'qut',  (n) => n === state.maxNewToQut);
    }

    function buildNumGrid(containerId, min, max, type, isSelected) {
        const el = document.getElementById(containerId);
        let html = '';
        for (let i = min; i <= max; i++) {
            const sel = isSelected(i);
            html += `<div class="t-num-cell ${sel ? 'selected' : ''}"
                  data-type="${type}" data-val="${i}"
                  onclick="toggleNum(this, '${type}', ${i})">
               ${i}${sel ? ' ✓' : ''}
             </div>`;
        }
        el.innerHTML = html;
    }

    function toggleNum(el, type, val) {
        if (type === 'size') {
            if (state.teamSizes.has(val)) state.teamSizes.delete(val);
            else state.teamSizes.add(val);
        } else {
            state.maxNewToQut = val;
        }
        buildGrids();
    }

    function toggleRule(rule) {
        state[rule] = !state[rule];
        const tick = document.getElementById(`tick-${rule}`);
        tick.style.visibility = state[rule] ? 'visible' : 'hidden';
    }

    function onCsvSelected(input) {
        const file = input.files[0];
        if (!file) return;
        document.getElementById('csvName').textContent = file.name;
        const reader = new FileReader();
        reader.onload = e => {
            const lines = e.target.result.split('\n').filter(l => l.trim());
            // Subtract 1 for the header row
            state.studentCount = Math.max(0, lines.length - 1);
        };
        reader.readAsText(file);
    }

    async function doCreate() {
        const unitName = document.getElementById('unitName').value.trim();
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = '';

        if (!unitName) { errEl.textContent = 'Unit name is required.'; return; }
        if (state.teamSizes.size === 0) { errEl.textContent = 'Select at least one valid team size.'; return; }

        try {
            await post('/api/units', {
                unitName,
                validTeamSizes: [...state.teamSizes].sort().join(','),
                maxOneGroup: state.maxOneGroup,
                mustShareTutorial: state.mustShare,
                maxNewToQut: state.maxNewToQut,
                studentCount: state.studentCount
            });
            window.location = '/teacher-home.html';
        } catch (e) {
            errEl.textContent = e.message;
        }
    }

    async function doLogout() {
        await post('/api/auth/logout', {});
        window.location = '/';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Home – TeamUp</title>
    <link rel="stylesheet" href="style1.css" />
    <link rel="stylesheet" href="teacher-style.css" />
</head>
<body>
<!-- Header -->
<header class="t-header">
    <button class="t-logout-btn" onclick="logout()">Log Out</button>
    <div class="t-header-title">
        <h1>Student Home</h1>
        <p id="welcome-msg">Welcome!</p>
    </div>
    <div class="t-logo">
        <img src="teamup-icon.png" alt="TeamUp" class="t-logo-icon" />
        <span class="t-logo-text"><span class="t-logo-team">Team</span><span class="t-logo-up">Up</span></span>
    </div>
</header>

<div class="t-divider"></div>

<!-- Unit card grid -->
<main class="t-unit-grid" id="unit-grid">
    <p id="loading-msg" style="padding:2rem;color:#555;">Loading your units…</p>
</main>

<footer style="text-align:center;padding:1rem;font-size:.75rem;color:#999;">High Fidelity Design Concept.</footer>

<script>
    // Check auth
    fetch('/api/auth/me')
        .then(r => r.json())
        .then(user => {
            if (!user || user.role !== 'STUDENT') {
                window.location = '/';
                return;
            }
            document.getElementById('welcome-msg').textContent =
                'Welcome, ' + (user.displayName || user.username) + '!';
            loadUnits();
        })
        .catch(() => window.location = '/');

    function loadUnits() {
        fetch('/api/units/student/enrolled')
            .then(r => r.json())
            .then(units => {
                const grid = document.getElementById('unit-grid');
                grid.innerHTML = '';
                if (!units.length) {
                    grid.innerHTML = '<p style="padding:2rem;color:#555;">You are not enrolled in any units yet.</p>';
                    return;
                }
                units.forEach(u => {
                    const card = document.createElement('div');
                    card.className = 't-unit-card';
                    card.innerHTML = `
              <div class="t-unit-card-body">
                <div class="t-unit-name">${u.unit_name}</div>
                <div class="t-unit-desc">${u.description || ''}</div>
                <div class="t-unit-sem">${u.semester || ''}</div>
              </div>
              <button class="t-open-btn" onclick="alert('Coming soon!')">Open</button>
            `;
                    grid.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('unit-grid').innerHTML =
                    '<p style="padding:2rem;color:#c00;">Failed to load units.</p>';
            });
    }

    function logout() {
        fetch('/api/auth/logout', { method: 'POST' })
            .then(() => window.location = '/');
    }
</script>
</body>
</html>
